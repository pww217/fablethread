      resources as absolute and has no patience for the sentimentalities of the before-world
      survivors.
    id: daniel_schneider
    name: Daniel Schneider
    notes: Struggling to stay upright, snarls in alarm about the approaching threat
      and the failing equipment.
    title: Settlement Foreman
