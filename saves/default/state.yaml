  world_state:
  - '**Ophiocordyceps novum** spreads through airborne spores in enclosed or still-air
    environments; outdoors, risk is wind-dependent; indoors without ventilation, a
    sealed mask is the difference between a rough twenty minutes and full host-conversion
    in two hours — and masks are harder to find than bullets.'
  - 'The infected are not mindless: **Clickers** (late-stage, echolocating, skull-bloomed)
    have no vision but track sound with surgical precision; **Stalkers** (mid-stage)
    hide, watch, and wait; **Runners** (early-stage, still partly aware) sometimes
    hesitate — and that hesitation is the worst thing about them; all stages are connected
    by a slow, underground mycelial network that takes hours to signal but can make
    a dormant nest active when another is disturbed kilometers away.'
  - 'Twenty years in, cities are forests: root systems have cracked the foundations,
    vines have collapsed the upper floors, rivers have re-routed through subway tunnels
    — the infrastructure survivors built their routines around is now a living, hostile
    landscape that changes season by season.'
  - FEDRA maintains strict quarantine blockades around all major metropolitan zones.
  - The black market economy relies entirely on pre-collapse scavenged hardware.
  - Infection spreads through fungal spores that thrive in damp, low-light environments.
