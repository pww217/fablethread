compendium:
  npcs:
    antonio_silva:
      allegiance: Pirate boarding party
      bio: A wiry pirate with a jagged scar across his nose, known for his opportunistic
        combat style during boarding actions. Collapses to one knee, clutching a catastrophic
        shoulder wound and reeling from shock.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 4
      name: Antonio Silva
      title: Pirate Attacker
    barry_stone:
      bio: A fast-moving boy tasked with bringing powder to the cannons.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 8
      name: Barry Stone
      title: Powder Monkey
    boarding_axe_attacker:
      bio: A blood-splattered pirate attacking the player amidst the wreckage of the
        deck. Attacking the player with a heavy boarding axe, using the wreckage to
        flank.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 9
      name: Boarding Axe Attacker
      title: Pirate
    boarding_sailor:
      bio: A sailor from the merchant vessel attempting to board the ship. Just killed
        by the player; currently a twitching heap on the deck.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 1
      name: Boarding Sailor
      title: Merchant Sailor
    burly_pirate:
      bio: A heavy-set attacker wearing a stained headband, recently struck by a lead
        bullet. Stunned against the mainmast amidst the renewed boarding action.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 5
      name: Burly Pirate
      title: Pirate Attacker
    flanking_pirates:
      bio: A pair of attackers working in tandem to surround the player using the
        battlefield's wreckage.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 9
      name: Flanking Pirates
      title: Pirates
    joshua_vane:
      bio: The enforcer of the Articles and the pragmatic voice of the crew.
      last_seen:
        location_id: the_black_marlin_deck
        location_name: The Black Marlin Deck
        turn: 10
      name: Joshua Vane
      title: Quartermaster
