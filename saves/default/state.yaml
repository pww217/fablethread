  world_state:
  - A pirate ship is a democracy with a knife at its throat — the crew votes on everything
    from course to cargo distribution, and the captain is elected and can be deposed
    if he fails. But the moment you board an enemy ship, democracy ends and violence
    begins.
  - Scurvy, dysentery, and infection kill more pirates than naval guns or hanging.
    A ship without fresh meat and clean water becomes a death trap in weeks. Every
    port stop is a race against rot.
  - The Caribbean is a maze of hidden coves, shallow reefs, and coral harbors where
    a shallow-draft sloop can hide from a deep-draft man-of-war. The best pirates
    don't fight — they ambush, strike fast, and vanish into waters the navy cannot
    follow.
  - Naval blockades restrict all merchant movement through the Eastern Straits.
  - Privateer commissions are currently being issued by the rogue governor of Edwardsland.
  - The price of black powder has tripled due to recent shortages in the colonies.
