<div id="save-picker-shell"
     x-data="savePicker()"
     x-show="isOpen"
     x-cloak
     class="pack-picker-backdrop"
     @click.self="close()"
     @keydown.escape.window="close()">
    <div id="save-picker-modal" class="pack-picker-modal" @click.stop>
        <div class="pack-picker-head">
            <span class="pack-picker-title">Load Save</span>
            <button type="button" class="pack-picker-close" @click="close()" aria-label="Close">×</button>
        </div>
        <div id="save-picker-body" class="pack-picker-body">
            <div x-show="loading" class="save-picker-loading">Loading saves…</div>
            <div x-show="!loading && filteredSaves().length === 0" class="save-picker-empty">
                No saves found.
            </div>
            <label x-show="!loading" class="save-picker-toggle">
                <input type="checkbox" x-model="showEvGames">
                <span>Show eval runs</span>
            </label>
            <div class="save-picker-list">
                <template x-for="save in filteredSaves()" :key="save.name">
                    <div class="pack-card-wrapper">
                        <div class="pack-card"
                             @click="selectSave(save.name)"
                             :class="{ 'pack-card--active': selectedId === save.name, 'pack-card--current': save.name === activeSaveName }">
                            <div class="pack-card-header">
                                <span class="pack-card-name" x-text="save.long_term_objective || save.display_name || save.name"></span>
                                <span class="save-card-current-badge" x-show="save.name === activeSaveName">active</span>
                            </div>
                            <div class="pack-card-dir" x-show="save.display_name && save.display_name !== save.name" x-text="save.name"></div>
                            <div class="pack-card-tags">
                                <span class="pack-card-tag" x-show="save.turn_count > 0">Turn <span x-text="save.turn_count"></span></span>
                                <span class="pack-card-tag" x-show="save.pack" x-text="save.pack"></span>
                                <span class="pack-card-tag" x-show="save.pc_name" x-text="save.pc_name"></span>
                                <span class="pack-card-tag" x-show="save.location_name" x-text="save.location_name"></span>
                            </div>
                            <div class="pack-card-modified" x-show="save.last_modified" x-text="formatTimestamp(save.last_modified)"></div>
                        </div>
                        <button type="button"
                                class="pack-card-delete"
                                title="Delete this save"
                                x-show="save.name !== activeSaveName"
                                @click.stop="deleteSave(save.name)">
                            &times;
                        </button>
                    </div>
                </template>
            </div>
        </div>
        <div class="pack-picker-foot">
            <button type="button" @click="newGame()" class="save-picker-new-game-btn">
                + New Game
            </button>
            <div class="pack-picker-foot-actions">
                <button type="button" @click="close()" class="pack-picker-cancel-btn">
                    Cancel
                </button>
                <button type="button"
                        @click="confirmSwitchSave()"
                        :disabled="!selectedId || loading"
                        class="pack-picker-confirm-btn">
                    <span x-show="!loading">Switch</span>
                    <span x-show="loading">Switching…</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function savePicker() {
    return {
        isOpen: false,
        loading: false,
        selectedId: null,
        saves: [],
        showEvGames: false,
        activeSaveName: '',

        open(activeSaveName) {
            this.activeSaveName = activeSaveName || '';
            this.isOpen = true;
            this.loading = true;
            this.selectedId = null;
            this.saves = [];
            this._fetchSaves();
        },

        close() {
            this.isOpen = false;
            this.loading = false;
            this.selectedId = null;
            this.saves = [];
        },

        async _fetchSaves() {
            try {
                const resp = await fetch('/api/saves');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                this.saves = data.saves || [];
            } catch (e) {
                console.error('Failed to fetch saves:', e);
                this.saves = [];
            } finally {
                this.loading = false;
            }
        },

        selectSave(id) {
            this.selectedId = id;
        },

        async confirmSwitchSave() {
            if (!this.selectedId) return;
            this.loading = true;
            try {
                const resp = await fetch('/api/switch-save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ save_name: this.selectedId }),
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (data.ok) {
                    window.location.reload();
                } else {
                    console.error('Switch save failed:', data);
                }
            } catch (e) {
                console.error('Failed to switch save:', e);
            } finally {
                this.loading = false;
            }
        },

        async deleteSave(name) {
            if (!confirm(`Delete save "${name}"? This cannot be undone.`)) return;
            this.loading = true;
            try {
                const resp = await fetch('/api/delete-save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ save_name: name }),
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    alert(data.error || 'Failed to delete save');
                    return;
                }
                await this._fetchSaves();
                if (this.selectedId === name) {
                    this.selectedId = null;
                }
            } catch (e) {
                console.error('Failed to delete save:', e);
                alert('Failed to delete save');
            } finally {
                this.loading = false;
            }
        },

        filteredSaves() {
            if (this.showEvGames) return this.saves;
            return this.saves.filter(s => s.kind !== 'eval');
        },

        newGame() {
            this.close();
            document.dispatchEvent(new CustomEvent('savepicker:new-game'));
        },

        formatTimestamp(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            if (isNaN(d.getTime())) return ts;
            const now = new Date();
            const diffMs = now - d;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHrs = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHrs < 24) return `${diffHrs}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        },
    };
}
</script>
