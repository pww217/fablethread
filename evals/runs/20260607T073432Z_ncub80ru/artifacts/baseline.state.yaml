compendium:
  npcs:
    amy_holly:
      bio: A woman with hair tied in a practical knot and eyes that have seen too
        many desperate travelers. Moves with a brisk, efficient rhythm and maintains
        a watchful eye on her shop.
      first_seen_turn: 7
      last_seen:
        location_id: red_canyon
        location_name: Red Canyon
        turn: 9
      name: Amy Holly
      presence: known
      title: General Storekeeper
    assay_clerk:
      bio: A man with deep-set wrinkles and ink-stained fingers, possessing a weary
        and cynical demeanor. He has spent years breathing in dust and parchment,
        leaving him with a raspy voice and little patience for travelers.
      first_seen_turn: 3
      last_seen:
        location_id: sheriff_station
        location_name: Sheriff's Station
        turn: 5
      name: Assay Clerk
      presence: known
      title: Clerk of the Assay Office
