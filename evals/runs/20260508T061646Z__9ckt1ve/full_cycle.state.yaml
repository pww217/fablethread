      last_seen:
        last_seen_state: wiping down the bar at the Crossed Keys
        location_id: service_corridor
        location_name: Service Corridor
        turn: 9
      last_seen_state: wiping down the bar at the Crossed Keys
      name: Edda
      title: Innkeeper
    marcus:
      bio: A wiry man with a nervous, twitching eye who flanks the bearded man at
