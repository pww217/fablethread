      last_seen:
        last_seen_state: ''
        location_id: crossed_keys_inn
        location_name: Crossed Keys Inn
        turn: 8
      last_seen_state: lingering outside the main entrance
      name: Marcus
      title: Thug
    matthew_estrada:
      bio: A calm and professional man who observes the tavern with a soldier-like
        precision; he remains unruffled by sudden physical confrontation.
      last_seen:
        last_seen_state: ''
        location_id: main_tavern
        location_name: Main Tavern
        turn: 11
      name: Matthew Estrada
      title: Professional Observer
