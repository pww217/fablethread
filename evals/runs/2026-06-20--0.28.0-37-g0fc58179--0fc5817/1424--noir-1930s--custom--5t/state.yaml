__seed_meta__:
  actions:
  - Demand that Miller shows me the official report immediately
  - Pressure Sterling to reveal exactly who he thinks took the editor
  - Inspect the telegram for any physical clues or hidden markings
  - Search my desk for any recent correspondence regarding the dockyard scandal
  opening_narrative: 'The rhythmic clatter of a typewriter with a stuck ''e'' key
    punctuates the heavy silence of the bullpen. You sit at your desk, the floor beneath
    your feet still slick from the rain that lashed against the windows an hour ago.
    Smoke hangs in thick, gray ribbons under the flickering ceiling lights, catching
    the pale glow of the streetlamps outside. The smell of stale coffee and cheap
    tobacco clings to your coat like a second skin.


    You are staring at a ledger when the heavy oak door slams open. Donald Miller
    stumbles in, his face ashen, clutching a crumpled telegram. He doesn''t head for
    the Sergeant''s office; he heads straight for you, ignoring the startled glances
    of the other officers. Behind him, Roger Sterling follows, looking less like a
    reporter and more like a man who has seen a ghost. Sterling’s usual cocky stride
    is gone, replaced by a frantic, twitching energy.


    ''Jerome, you need to see this,'' Miller says, his voice cracking as he drops
    the telegram onto your desk, right over your neatly organized notes. The paper
    is damp. ''They took him. Right from the newsroom.''


    Sterling leans over your desk, his shadow falling across your ledger. He doesn''t
    wait for an invitation. ''The editor of the Gazette,'' Sterling whispers, his
    eyes darting toward the door to ensure no other officers are listening too closely.
    ''They didn''t just grab him, Vance. They left a note. A demand for the city council
    to lift the printing embargo or they release the ledger from the dockyard scandal.''


    You look down at the telegram. The ink is smudged, but the words are clear: *The
    truth has been silenced; now we silence the voice of the truth.*


    Miller leans closer, his voice dropping to a low growl. ''If this gets out to
    the public before we find him, the Commissioner will have my badge for breakfast,
    and you''ll be looking for work in a gutter. The council is already breathing
    down our necks about the dockyard strikes. We can''t afford a kidnapping scandal
    on top of everything else.''


    Sterling taps his finger nervously against the wood of your desk. ''I can help
    you find him, Vance. I have contacts near the waterfront that the precinct doesn''t
    know about. But you owe me for that business down at the pier last winter. It''s
    time to settle up.''


    You realize the gravity of the situation immediately. This isn''t just a kidnapping;
    it is a direct strike against the city''s fragile information control. If the
    editor dies or the ledger is leaked, the entire power structure of East Jonathanton
    will crumble, and you will be caught in the middle of the wreckage.'
  outcome_summary: An editor has been kidnapped by unknown assailants to force a change
    in media censorship laws.
