__seed_meta__:
  actions:
  - Confront Nicholas about the missing water shipments directly.
  - Deflect suspicion by claiming you were merely scavenging for scraps.
  - Investigate the abandoned bedding for clues about the previous occupant.
  - Withdraw toward the industrial ruins to avoid a confrontation.
  opening_narrative: 'The acrid smell of bleach concentrate stings your nostrils,
    thick enough to taste on the back of your tongue. You stand in the shadow of a
    decontamination tent, its heavy plastic flap torn and flapping rhythmically against
    the metal frame like a dying heartbeat. Overhead, the rhythmic, distorted loop
    of a recorded warning echoes endlessly off the cracked concrete walls: ''Remain
    stationary. Compliance is safety. Awaiting clearance.'' The sound is a dull, maddening
    drone that never quite fills the silence between its own repetitions.


    You glance toward the perimeter fence, where layers of yellow biohazard tape flutter
    in the biting wind, looking like strips of dead skin clinging to the wire. Nearby,
    a pile of bedding has been abandoned in the mud, soaked through and smelling of
    damp rot, suggesting someone left in a desperate hurry. The sector is quiet, save
    for the loudspeaker''s mechanical drone, but the tension is thick, heavy as the
    humidity before a storm.


    You are not supposed to be here. As a pariah, your presence in the quarantine
    zone is a violation of the Ministry''s latest decree, yet the water canisters
    you carry are the only thing keeping the people in the lower slums from total
    dehydration. You feel the weight of the steel wrench in your pocket, a cold reminder
    of the world that used to work.


    The sound of heavy boots crunching on gravel breaks the loop of the loudspeaker.
    Two Enclave guards emerge from the haze of the decontamination corridor, their
    silhouettes sharp against the grey light. The taller one, whose eyes dart nervously
    toward the torn tent, holds his rifle at a low ready, while the shorter guard
    keeps his gaze fixed strictly on the ground, his jaw tight.


    Then, the third figure approaches, walking with a stride that commands the space
    between the ruins. Nicholas Shaw. He doesn''t look like the man who once shared
    a ration of real coffee with you in the dark of the old barracks; he looks like
    a machine of the Ministry now, his uniform pressed and his expression unreadable.
    He stops ten feet from you, the guards flanking him like twin pillars of the law.


    ''Terrance,'' Nicholas says, his voice low, barely rising above the drone of the
    loudspeaker. He doesn''t draw his weapon, but his hand rests heavily on the grip
    of his sidearm. ''You were seen near the supply depot. The Ministry does not take
    kindly to unauthorized inventory inspections.''


    The guards shift, their eyes locking onto yours. You can see the sweat bead on
    the tall guard''s brow despite the chill. They are terrified, and that makes them
    dangerous. Nicholas steps closer, his eyes searching yours for a sign of the man
    he used to know, or perhaps looking for the moment he has to justify the order
    to detain you. The reality of the rationing crisis is written in the hollows of
    his cheeks, a truth he is paid to deny, even as the people starve just beyond
    the fence.'
  outcome_summary: Terrance Salazar is confronted by Captain Nicholas Shaw and two
    guards within the quarantine zone's perimeter.
