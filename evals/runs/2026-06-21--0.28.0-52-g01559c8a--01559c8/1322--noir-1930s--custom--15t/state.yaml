__seed_meta__:
  actions:
  - Stand up and pull Vance toward the kitchen exit.
  - Confront the two men before they reach our table.
  - Keep a low profile and watch the room for an escape route.
  - Demand Mark Holloway help us get out through the back.
  opening_narrative: 'The smell of stale rye and unwashed wool clings to your throat.
    You sit at a corner table in the Blind Pig, watching the amber liquid swirl in
    your glass, the light from the low-hanging lamps barely cutting through the haze
    of blue cigarette smoke. The music from the phonograph in the corner skips rhythmically,
    a scratching sound that sets your teeth on edge. Around you, the low laughter
    from the back room drifts over, punctuated by the constant, rhythmic clink of
    glasses behind the bar.


    Anthony Vance sits opposite you, his face pale under the dim light. He hasn''t
    touched his drink. His fingers twitch against the wood of the table, and every
    time the door to the speakeasy creaks, he flinches as if expecting a blow. You
    remember him from that courtroom two years ago—the way his voice cracked when
    he realized the witnesses had all changed their stories simultaneously. He was
    supposed to be your star witness, the one who would finally pin the waterfront
    graft on the union leaders, but instead, he became the man whose failure ended
    your career.


    ''They know, David,'' Vance whispers, leaning in so close you can smell the sour
    sweat on his collar. ''The papers... they aren''t just ignoring it anymore. They''re
    actively burying it. They sent a man to my apartment this morning. He didn''t
    say a word, just stood there, watching.''


    You scan the room, your eyes trained to read the tension in a space before the
    violence starts. Mark Holloway, the bartender, is wiping the brass rail with more
    force than necessary, his eyes darting toward the entrance every time a patron
    enters. The atmosphere has shifted; the casual murmur of the patrons has dipped
    into an uneasy, watchful quiet.


    At the threshold of the club, two men enter. They don''t look like the usual crowd
    looking for a quick drink to forget the day. One is tall, wearing a heavy bowler
    hat that casts his eyes into deep shadow, moving with a measured, predatory stillness.
    Beside him, a shorter man with a thick neck and a nervous habit of tapping a lead
    pipe against his thigh scans the room. They aren''t looking for a seat; they are
    looking for a specific face. They begin to move through the crowd, cutting through
    the smoke toward your corner. Vance sees them too. His breathing hitches, and
    he reaches into his coat, clutching something small and hard. He looks at you,
    eyes wide with a frantic, desperate plea, waiting to see if you are still the
    man who can keep him alive or just another ghost of the past.'
  outcome_summary: Anthony Vance has identified his pursuers, placing him in immediate
    danger within the speakeasy.
