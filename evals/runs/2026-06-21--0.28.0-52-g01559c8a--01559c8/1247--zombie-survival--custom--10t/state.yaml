__seed_meta__:
  actions:
  - Demand that Raymond explain the new patrol restrictions.
  - Approach Jimmy Snyder to investigate his influence over the crowd.
  - Inspect the nearby water crates for signs of tampering.
  - Withdraw quietly from the intersection to avoid a confrontation.
  opening_narrative: 'The rhythmic crunch of broken glass under your boots is the
    only sound in the intersection. A heavy, stagnant heat hangs over the street,
    carrying the cloying buzz of flies circling a discarded heap near the boarded
    grocery store. You step around a mattress that has been dragged halfway across
    the road, its fabric stained and damp from the last rain. To your left, a burned-out
    car sits like a rusted skeleton, with small, pale saplings pushing through the
    gaps in its chassis. The swinging door of the grocery store groans on a single
    hinge, a rhythmic creak that feels like a warning.


    You were checking the perimeter near the water crates when you saw him. Raymond
    Love is standing by the edge of the intersection, his silhouette sharp against
    the midday sun. He isn''t alone. Two residents stand behind him, their eyes fixed
    on the ground, refusing to meet your gaze. Raymond looks older than he did a month
    ago; the lines around his mouth have deepened into permanent trenches. He watches
    you with a clinical detachment that feels more like a judgment than a greeting.


    "You shouldn''t be out here without a permit, Edwin," Raymond says, his voice
    devoid of the warmth it once held when you two stood shoulder-to-shoulder in the
    breach. "The council has issued new directives regarding unauthorized patrols.
    We cannot have former officers wandering the streets and causing confusion."


    Behind him, a small crowd begins to gather near the corner. They aren''t looking
    at the water crates or the broken storefronts; they are looking at Jimmy Snyder,
    who is standing atop a rusted crate. Jimmy is gesturing wildly toward the sky,
    his voice carrying a frantic, melodic quality that cuts through the heavy air.
    The residents aren''t listening to Raymond''s warnings; they are leaning in toward
    Jimmy, their faces illuminated by a terrifying sort of hope. You realize then
    that the authority you once commanded hasn''t just slipped away—it has been replaced.
    The tension in the street is no longer about the scarcity of water or the broken
    roads; it is the electric, vibrating energy of a community deciding to follow
    a different master. Raymond steps closer to you, his eyes narrowing. "The people
    need stability, Edwin. Not ghosts from a dead world. If you continue this, we
    will have no choice but to treat you as a trespasser."'
  outcome_summary: Edwin Ritter confronts Raymond Love amidst a growing religious
    fervor in the Saundersburgh intersection.
