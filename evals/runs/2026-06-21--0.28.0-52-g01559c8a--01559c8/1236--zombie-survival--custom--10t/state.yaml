__seed_meta__:
  actions:
  - Hand over the copper wire to satisfy Melvin's demand.
  - Argue that the pump repair is more vital than the perimeter.
  - Quickly hide the copper wire spool beneath your tools.
  - Deflect by pointing out the immediate leak in the pump housing.
  opening_narrative: "The rhythmic, metallic drip of condensation from an overhead\
    \ pipe hits the concrete floor with a hollow, lonely sound. You can taste the\
    \ stale, copper-heavy air of the bunker, a scent that has become more familiar\
    \ to you than the smell of rain ever was. In the dim light of the substation,\
    \ the water filtration pump groans, its cracked housing weeping a steady stream\
    \ of greyish fluid onto the floor.\n\nYou are hunched over the control panel,\
    \ your fingers tracing the jagged fracture in the casing. Beside you, the heavy\
    \ steel wrench feels like an extension of your own arm, a tool that has seen more\
    \ of the post-collapse world than most of the people living above this bunker\
    \ ever will. The military radio on the workbench beside you emits nothing but\
    \ low, rhythmic static, a white noise that fills the gaps between the pump's dying\
    \ gasps.\n\nThe heavy steel door at the top of the stairs thuds shut, the sound\
    \ echoing sharply down the narrow corridor. You don't need to look up to know\
    \ who it is; the heavy, measured footsteps of Melvin Reeves carry a weight that\
    \ isn't just physical. He approaches, his shadow stretching long and thin across\
    \ the damp floor, accompanied by the rhythmic clatter of two militia guards. \n\
    \nMelvin stops just short of your workspace, his presence casting a chill that\
    \ has nothing to do with the subterranean temperature. He doesn't look at the\
    \ leak or the cracked housing; he looks directly at you, his eyes hard and unyielding.\
    \ Behind him, the two guards stand like statues, their hands resting near the\
    \ holsters of their sidearms. One of them, a man with a nervous twitch in his\
    \ jaw, keeps glancing toward the copper wire spool sitting on your workbench.\n\
    \n'The Council has made a decision, Jeffery,' Melvin says, his voice devoid of\
    \ any warmth. He gestures vaguely toward the settlement above, where the water\
    \ crisis is turning into a riot. 'We cannot afford to waste more of the sector's\
    \ remaining copper on experimental repairs that might not hold. The militia needs\
    \ those supplies to reinforce the North Luis perimeter.'\n\nYou feel the weight\
    \ of his gaze, and more importantly, the unspoken threat of the guards behind\
    \ him. You know what he is really saying. He isn't here to ask for your expertise;\
    \ he is here to strip you of the very materials you need to prevent the entire\
    \ system from collapsing. If you use that copper to patch the pump, you leave\
    \ the perimeter vulnerable to the faction raids that have been increasing near\
    \ the border closures. If you give it to him, the water stops flowing by morning.\n\
    \n'The pump won't hold another forty-eight hours without those reinforcements,'\
    \ you say, your voice raspy from the dry air. You keep your eyes on the cracked\
    \ housing, refusing to meet his stare. 'If I don't use the wire now, there won't\
    \ be a settlement left to defend.'\n\nMelvin steps closer, his shadow swallowing\
    \ your work area completely. 'The settlement survives by order, not by hope, Engineer.\
    \ Hand over the spool. Now.' One of the guards shifts his weight, the leather\
    \ of his gear creaking in the silence of the bunker. You can feel the tension\
    \ coiled like a spring between the man who once helped you hold a breach during\
    \ the Great Flight and the man who now views your survival as an inconvenient\
    \ variable in his calculations."
  outcome_summary: Melvin Reeves demands the settlement's remaining copper wire, forcing
    a choice between water stability and perimeter security.
