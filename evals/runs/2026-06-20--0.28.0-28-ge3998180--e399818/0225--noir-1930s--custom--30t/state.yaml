__seed_meta__:
  actions:
  - Hand the torn manifest page to Brian immediately.
  - Confront Brian about his involvement in the harbor payoffs.
  - Duck behind the oil-slicked crates to avoid the approaching light.
  - Demand to know who is approaching from the warehouse.
  opening_narrative: 'The copper tang of wet metal sits heavy on your tongue. A thick,
    grey fog rolls off the harbor, swallowing the silhouettes of the massive cranes
    that loom over Pier Nine like skeletal giants. Somewhere in the distance, the
    deep, mournful horn of a departing freighter vibrates through the soles of your
    shoes, muffled by the damp air. The pier is slick with oil and seawater, making
    every step a calculated risk against a fall into the black water below.


    You stand near a stack of crates, the rhythmic clang of metal on metal echoing
    from a nearby warehouse—a worker finishing a late shift, or perhaps something
    more sinister. You clutch the torn page of the Customs manifest in your pocket;
    it feels heavier than a scrap of paper should. This single sheet is the only thing
    keeping you from a shallow grave or a mountain of debt.


    A shadow detaches itself from the fog. Brian Vance approaches, his heavy footsteps
    uneven on the oil-slicked wood. He doesn''t look like the boy you used to run
    races with in the alleys of New Troyfort; his face is a map of hard years and
    compromised morals. He stops five feet away, his eyes darting toward the dark
    warehouse entrance where a silhouette lingers.


    ''You shouldn''t have come here, Frank,'' Brian says, his voice low and raspy,
    barely carrying over the sound of the lapping tide. He reaches into his coat,
    not for a weapon, but to pull out a crumpled cigarette. ''The inspector is already
    talking to the boys from the North Side. If they find out you''ve got that page,
    they won''t bother with a trial. They''ll just drop you in the drink.''


    Before you can respond, a sudden movement near the crane catches your eye. A heavy
    load of timber shifts high above, the chains groaning under the tension. The sound
    is deaf-ening in the quiet fog. Brian flinches, his hand instinctively moving
    toward his waistband. He looks at you, not with affection, but with a desperate
    sort of pity. ''Give me the paper, Frank. I can make the debt go away if you just
    walk away now. Don''t force me to choose between my job and our history.''


    A flashlight beam cuts through the fog from the direction of the warehouse, sweeping
    across the oil-slicked pier. Someone is coming, and they aren''t walking with
    the heavy, rhythmic gait of a dockworker. The tension in the air is thick enough
    to choke on; the choice between your survival and the truth is no longer theoretical.'
  outcome_summary: Frank Vance faces a confrontation with Brian Vance amidst a fog-shrouded
    pier as authorities approach.
