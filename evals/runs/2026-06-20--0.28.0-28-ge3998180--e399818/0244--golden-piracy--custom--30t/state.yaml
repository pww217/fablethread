__seed_meta__:
  actions:
  - Confront Marvin about his suspicions regarding the sabotage.
  - Investigate the dark fluid leaking from the lower hatchway.
  - Command Paul to secure the powder magazine immediately.
  - Draw your cutlass to assert authority over the gathering crew.
  opening_narrative: 'The rhythmic snap of canvas overhead is the only steady thing
    in a world gone sideways. Salt spray stings your eyes, slicking the quarterdeck
    until every step feels like a gamble against the tilting wood. Above you, the
    rigging hums under intense strain, vibrating with the force of a wind that smells
    more of gunpowder than brine.


    You stand near the gimbaled brass mount of the ship''s compass, watching the needle
    dance erratically as the Vanguard pitches heavily through the swell. The creak
    of the helm under pressure sounds like a dying man''s moan. Just below the quarterdeck,
    the heavy thud of something shifting in the hold echoes up through the floorboards—a
    dull, wet sound that doesn''t belong to any standard cargo. It is the sound of
    something being systematically undone.


    Marvin, the Quartermaster, slams a heavy hand onto the rail near you, his face
    a mask of controlled fury. He points toward the hatchway where Paul, the powder
    monkey, is darting between crates with frantic, uncoordinated movements. The boy''s
    eyes are wide, reflecting a terror that goes beyond the storm. ''The barrels in
    the lower hold,'' Marvin bellows over the wind, his voice cutting through the
    roar of the sea. ''They aren''t just leaking water, Clayton. They''re leaking
    something else. Someone''s been cutting into the spice casks to hide the rot.''


    You look down and see a dark, viscous fluid seeping from beneath the main hatch,
    mixing with the seawater on the deck. It isn''t spice; it''s thick, oily, and
    smells of fermented bile and sabotage. The crew is already gathering at the rail,
    their eyes shifting between the leaking cargo and the weapons at their hips. They
    aren''t looking at the storm anymore; they are looking at each other. Marvin grips
    the hilt of his heavy blade, his gaze locking onto yours with a silent, desperate
    demand for order. He knows you were once an officer, and he knows you know how
    to handle a riot before it becomes a massacre. The tension is a physical weight,
    heavier than the swell, as the realization sinks in: the sabotage wasn''t meant
    to sink the ship, but to starve the crew into a mutiny.'
  outcome_summary: The cargo has been compromised by unknown hands, sparking immediate
    unrest among the crew on the quarterdeck.
