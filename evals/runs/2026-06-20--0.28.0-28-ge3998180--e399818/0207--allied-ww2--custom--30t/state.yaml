__seed_meta__:
  actions:
  - Order Lowery to help secure the medical crates immediately.
  - Check on the wounded driver to assess his stability.
  - Scour the nearby rubble for any discarded weapon or tool.
  - Search the wreckage of the truck for hidden fuel reserves.
  opening_narrative: 'The smell of burnt diesel and wet ash clings to the back of
    your throat. You can hear the rhythmic, hollow echo of boots on broken stone as
    your squad moves through the rubble-choked streets of South Janice. A few yards
    ahead, a field kitchen sits abandoned near a collapsed stone wall, its stove still
    radiating a faint, dying heat that cuts through the morning chill. The village
    is a skeleton of its former self; smoke haze from a recent fire drifts lazily
    between the ruins of cottages, obscuring the view of the road ahead.


    You find the convoy stalled at the narrowest point of the village square. A heavy
    transport truck has jackknifed across the path, its chassis resting precariously
    against a half-collapsed beam of a nearby tavern. The driver is slumped against
    a wheel, his face pale as he presses a blood-soaked rag to a jagged wound on his
    thigh. Nearby, a church bell lies partially buried in the rubble of the parish,
    looking like a discarded metal skull.


    ''Sergeant Ryan! Get those crates moved!'' Corporal Mark Lowery shouts over the
    crackle of a small fire nearby. He is pacing aggressively around the wreckage,
    his face flushed with a frantic sort of anger. He kicks at a dented fuel can,
    his eyes darting toward the dark treeline bordering the village. ''If we don''t
    get this medical shipment and the fuel out of here before the scouts find us,
    it''s our necks on the line. I didn''t spend three hours hauling this through
    the mud just to watch it burn!''


    Lowery''s voice is sharp, cutting through the heavy silence that follows his outburst.
    You remember the last time he tried to take charge of a supply run—the argument
    that ended with him nearly getting your squad court-martialed for ''misplaced''
    rations. He looks at you now, not as a fellow veteran, but as an obstacle to his
    orders. Behind him, the wounded driver groans, a low and pained sound that seems
    to draw more attention to your position than any gunshot would. The silence of
    the village feels heavy, as if the ruins themselves are waiting for something
    to break.'
  outcome_summary: A wrecked supply convoy sits exposed in a bombed-out village under
    the threat of approaching scouts.
