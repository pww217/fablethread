__seed_meta__:
  actions:
  - Confront Andrew about his refusal to prioritize the child's life.
  - Deflect the guards by focusing on the immediate medical necessity of the boy.
  - Investigate the guard's nervous behavior for signs of hesitation or sympathy.
  - Withdraw from the argument to secure the remaining antibiotics for yourself.
  opening_narrative: 'The hum of the surgical light on backup power is a rhythmic,
    irritating buzz that vibrates in your teeth. It flickers every few seconds, casting
    long, twitching shadows across the water-damaged patient charts scattered on the
    floor. The air in the clinic is heavy, thick with the copper tang of blood and
    the unmistakable, sweet rot drifting from the locked ward at the end of the hall.


    You are hunched over a gurney with torn restraints, trying to steady your hands
    as you examine a wound that looks far too much like the ones that caused the Smithside
    breach years ago. A syringe, half-filled with a dark, viscous fluid, sits on the
    tray beside you, reflecting the stuttering light.


    The heavy doors of the clinic slam open, hitting the stone wall with a crack that
    sounds like a gunshot. Andrew Walker strides in, his boots thudding heavily on
    the grime-slicked floor. He is flanked by two militia guards; one stands with
    his hand resting on his holster, his eyes darting nervously around the dim room,
    while the taller guard keeps his face a mask of stony indifference.


    ''Enough, Marcus,'' Andrew says, his voice cutting through the hum of the light.
    He doesn''t look at the patient on the gurney; he looks only at you, his eyes
    cold and calculating. ''The Council has made a decision. We cannot afford to waste
    these remaining doses on someone who cannot contribute to the labor rotation.''


    The patient on the table, a young boy with skin greyed by fever, let out a wet,
    hacking cough that seems to echo too loudly in the sterile silence of the room.
    The guard with the nervous hands shifts his weight, his eyes wide as they land
    on the boy''s pale face.


    ''He is a child, Andrew,'' you say, your voice steady despite the knot tightening
    in your chest. You remember when this man stood beside you at the first well-digging,
    his hands covered in the same red earth that now stains your medical apron. ''He
    isn''t a laborer yet, but he will be if we treat this infection.''


    Andrew steps closer, into the circle of light cast by the flickering lamp. He
    leans over the tray, his shadow engulfing both you and the boy. ''The Council
    is not interested in what might be, Marcus. They are interested in what is. We
    have three doses of Amoxicillin left for the entire sector. If we use them here,
    the workers at the North Gate will go down by morning.''


    The taller guard steps forward, his hand tightening on his weapon. ''The Overseer''s
    word is final, medic. Step away from the boy.''


    You feel the weight of the heavy revolver at your hip, a relic of the man you
    used to be, and the crushing reality of the man you have become. The choice is
    laid bare under the flickering light: obey the man who replaced you and let the
    boy die, or defy the authority that keeps the settlement from tearing itself apart.'
  outcome_summary: Andrew Walker demands the immediate redirection of medical supplies
    away from a non-productive patient.
