__seed_meta__:
  actions:
  - Confront Flores about his presence in this sector
  - Attempt to slip out through the propped open back door
  - Keep your hands visible and cooperate with the guard sweep
  - Check your gear quietly while pretending to drink
  opening_narrative: 'The bitter scent of recycled oxygen and stale tobacco hangs
    heavy in the air. You sit at a corner table, listening to the rhythmic jangle
    of an out-of-tune piano from the far end of the room while a synthesizer beside
    you hums as it dispenses a lukewarm, brown liquid into a chipped ceramic cup.


    The Rusty Valve is unusually quiet tonight, save for the low drone of the cooling
    unit cycling in the corner. A back door stands propped open by a heavy metal crate,
    allowing a draft of thin, metallic-tasting air to swirl through the smoke-filled
    room. You watch a marked deck of cards sit abandoned on a nearby table, left mid-game
    by someone who clearly left in a hurry.


    The peace is shattered when the front doors hiss open with sudden, violent force.
    Two patrol guards march in, their heavy boots thudding against the metal floorboards.
    They do not look like they are here for a drink. Following them, Steven Flores
    enters with a measured, predatory stride that you recognize instantly from your
    days navigating the contested zones of the rim.


    Flores does not even look at the bar; his eyes go straight to the crowd, scanning
    faces with a cold, analytical precision. He signals to the guards, who immediately
    begin fanning out to block the exits. The room goes silent. You feel the weight
    of your service pistol against your hip and realize that your presence here, in
    a hub so close to the Schmidtshire gates, is far from accidental.


    Flores stops at a table just three meters from yours, tapping a digital tablet
    against his palm. He looks up, his gaze locking onto yours with an unsettling
    familiarity. He knows you, and more importantly, he knows exactly what kind of
    pilot you are. The guards move toward your section, their hands resting on their
    shock batons as they prepare to begin the mandatory biometric sweeps.'
  outcome_summary: A sudden customs inspection by Inspector Flores puts Jonathan Griffith
    under immediate scrutiny.
