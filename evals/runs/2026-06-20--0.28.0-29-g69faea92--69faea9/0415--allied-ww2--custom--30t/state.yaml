__seed_meta__:
  actions:
  - Ask Miller for specific instructions on holding the line.
  - Check the wounded infantryman to see if he can still fight.
  - Scan the dark orchard through the periscope rifle.
  - Search the mud near the collapsed parapet for lost gear.
  opening_narrative: "The copper taste of adrenaline and wet earth fills your mouth.\
    \ You are lying on your back, staring up through a canopy of smoke where the moonlight\
    \ struggles to pierce the haze of cordite. Above you, the rhythmic thump of distant\
    \ artillery vibrates through the very ground beneath your spine, a dull pulse\
    \ that feels like a heartbeat in the mud. \n\nYou struggle to sit up, your hands\
    \ slipping on the slick, mud-choked duckboards of the trench. Everything is disorienting.\
    \ The jump was supposed to be clean, but the wind tore your chute sideways, dumping\
    \ you into this shallow scar in the earth instead of the designated landing zone.\
    \ To your left, a crumbling sandbag parapet has partially collapsed under the\
    \ weight of recent shelling, spilling loose dirt and spent brass into the walkway.\
    \ A periscope rifle lies abandoned against the wall, its lens cracked and reflecting\
    \ nothing but the gray sky. \n\n'Get your head down, Fordbury!' The voice is sharp,\
    \ cutting through the ringing in your ears. James Miller is crouched a few feet\
    \ away, his face a mask of grime and exhaustion. He doesn't look at you with sympathy;\
    \ he looks at you as if you are just another piece of equipment that arrived slightly\
    \ out of alignment. He is checking the action on his rifle, his movements mechanical\
    \ and practiced. Nearby, two infantrymen are huddled in a shallow indentation\
    \ in the trench wall. One of them is clutching a forearm wrapped in a blood-soaked\
    \ bandage, his eyes wide and unfocused, while the other sits motionless, staring\
    \ into the dark valley below as if waiting for something to emerge from the trees.\n\
    \nThe smell of cordite is thick, clinging to your clothes like a second skin.\
    \ You realize you are still clutching your M1 Garand so tightly your knuckles\
    \ are white. This isn't the orderly training in the states; there is no sergeant\
    \ shouting corrections here, only the heavy, suffocating reality of a front line\
    \ that feels both too small and infinitely too large. The valley below is a graveyard\
    \ of scorched orchards, where the silhouettes of broken trees look like reaching\
    \ hands in the dark. \n\nMiller reaches out and grabs your shoulder, his grip\
    \ bruisingly tight. 'You're late to the party, kid. We've got a gap in the line\
    \ near the bend, and the patrols haven't checked in for an hour. If you can't\
    \ hold that rifle, get out of the way before you draw fire.' He gestures toward\
    \ the dark bend where the trench disappears into a bend of shadow. The tension\
    \ in the air is palpable—a heavy, waiting stillness that feels more dangerous\
    \ than the artillery. You are a replacement, a name on a manifest meant to fill\
    \ a hole left by a man you never knew, and as the thunder of the guns rolls closer,\
    \ you realize the hole you're filling is much deeper than just a slot in a squad."
  outcome_summary: Gregory Fordbury has arrived at the frontline trench during a period
    of intense instability and missing patrols.
