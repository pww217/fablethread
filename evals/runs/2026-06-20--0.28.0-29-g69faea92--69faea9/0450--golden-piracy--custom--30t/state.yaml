__seed_meta__:
  actions:
  - Draw my cutlass and stand between Luis and the approaching sailors.
  - Demand that Luis helps me secure the smashed sea chest immediately.
  - Signal Joseph to hide before the navy patrol spots him.
  - Attempt to retreat toward the higher ground of the cliffs.
  opening_narrative: "The hiss of waves on shingle is the only sound breaking the\
    \ heavy silence of the cove. You stand on the damp sand, the salt spray stinging\
    \ your eyes as the tide begins its relentless climb toward your boots. A longboat\
    \ sits lopsided on the shoreline, its hull scraping against the stones with every\
    \ surge of the sea. Nearby, a sea chest lies partially buried in the wet sand,\
    \ its heavy iron lock smashed clean off, spilling a few glinting coins into the\
    \ rising surf. The cry of gulls overhead sounds more like mocking laughter than\
    \ nature's song.\n\nLuis Rivera stands five paces from you, his hand resting heavily\
    \ on the hilt of his cutlass. His face is a mask of stone, though the tension\
    \ in his jaw betrays him. He isn't looking at the smashed chest; he is looking\
    \ at you, his eyes tracking the movement of your hands with a practiced, lethal\
    \ suspicion. Behind him, Alan Vance is kneeling by the longboat, his fingers stained\
    \ dark with antiseptic as he tries to patch a tear in the canvas, his movements\
    \ hurried and devoid of his usual methodical calm. The surgeon's breath comes\
    \ in short, ragged bursts.\n\n\"The Articles are clear, Marcus,\" Luis says, his\
    \ voice low and dangerous, barely rising above the roar of the surf. \"We don't\
    \ leave anything behind. Not the silver, and certainly not the men who were supposed\
    \ to guard it.\" He steps closer, the shadow of his frame falling over you. The\
    \ air between you is thick with more than just salt; it is heavy with the memory\
    \ of the man you killed—the man Luis once called brother. The debt hasn't been\
    \ paid, and the crew knows it.\n\nFrom the edge of the treeline, a shadow moves.\
    \ Joseph, the powder monkey, darts between the rocks, his small frame barely visible\
    \ in the dimming light. He isn't running toward the ship; he is watching the mouth\
    \ of the cove with wide, terrified eyes. He looks at you, then back toward the\
    \ sea, his face pale. \n\n\"They're coming, aren't they?\" Luis asks, though it\
    \ isn't a question. He doesn't wait for an answer. He turns his gaze toward the\
    \ dark water of the channel. \"The men are talking, Marcus. They say the Captain\
    \ has lost his nerve, and they say you've lost yours along with him. If we don't\
    \ secure this haul and get back to the ship before the tide covers the path, there\
    \ won't be a crew left to command—only a mob.\" \n\nA sudden commotion breaks\
    \ from the direction of the longboat. Alan stands up abruptly, his medical kit\
    \ clattering against the stones. \"Quiet, both of you!\" the surgeon snaps, his\
    \ voice cracking with uncharacteristic heat. \"We have enough trouble with the\
    \ rising water without you two starting a bloodbath on the sand.\" He points toward\
    \ the mouth of the cove where the silhouettes of three men emerge from the mist—not\
    \ your crew, but men wearing the distinct, dark coats of the Royal Navy patrol,\
    \ their lanterns flickering like predatory eyes in the gloom. They have found\
    \ the cove, and they have found the wreckage of your failed raid."
  outcome_summary: The crew is divided by suspicion while a Royal Navy patrol approaches
    the cove.
