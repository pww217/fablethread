__seed_meta__:
  actions:
  - Confront Jermaine about the photograph in the crime scene evidence.
  - Question Officer Austin Miller about his nervous behavior near the files.
  - Search the padlocked filing cabinet for missing case records.
  - Leave the precinct immediately to find the witness before they disappear.
  opening_narrative: 'The rhythmic clatter of a typewriter with a stuck ''e'' key
    cuts through the heavy air of the precinct. You sit at your desk, the smell of
    stale coffee and cheap tobacco clinging to your wool coat like a second skin.
    Rain has tracked into the building, leaving patches of slick, dark water on the
    linoleum floor that reflect the dim, yellow glow of the ceiling lights. Smoke
    hangs in thick, stagnant clouds under the lamps, swirling whenever someone walks
    past.


    Detective Jermaine Peters leans over your desk, his shadow stretching long across
    your paperwork. He drops a heavy manila folder onto the wood with a thud that
    makes the pens in your holder rattle. His eyes are bloodshot, and he looks like
    he hasn''t slept since the docks went dark last Tuesday. Behind him, Officer Austin
    Miller stands by the water cooler, his hands shaking slightly as he grips a paper
    cup, his eyes darting toward the padlocked filing cabinet in the corner.


    "It is not your business, William," Jermaine says, his voice low and raspy, cutting
    through the mechanical clatter of the teletype machine. "The brass wants this
    closed quietly. A dockworker found dead near the West Christopherview blockade.
    No witnesses, no motive, no nothing."


    He slides a crime scene photograph toward you. It shows a body sprawled against
    a crate, but your eyes immediately drift to something else in the corner of the
    frame: a torn piece of a family photograph clutched in the dead man''s hand. You
    recognize the face in the photo—it belongs to the wife of the very man who is
    supposed to be the star witness for the prosecution.


    "The kid who saw the whole thing," Jermaine continues, leaning closer so his scent
    of peppermint and old sweat fills your space, "he is getting cold feet. He claims
    he didn''t see anything, but we both know that is a lie. The precinct wants him
    to stay quiet for his own good. You stay away from him, or you will find yourself
    back in the records basement for good."


    Just then, the heavy precinct doors swing open, and the wet slap of boots echoes
    through the room. Austin Miller stiffens, nearly spilling his water, as a shadow
    falls across the threshold. The tension in the room shifts instantly; the air
    feels thinner, more dangerous. Jermaine''s hand moves instinctively toward the
    holster at his hip, not to draw, but as a reflex of a man who no longer trusts
    the very walls he works within.'
  outcome_summary: A murder investigation involving a key witness is being suppressed
    by precinct leadership.
