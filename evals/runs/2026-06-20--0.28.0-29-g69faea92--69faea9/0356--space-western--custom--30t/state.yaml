__seed_meta__:
  actions:
  - Confront Ricardo about the specific details of the seized skiffs.
  - Deflect attention by loudly questioning the quality of the synthesizer's output.
  - Investigate the militia guards' reaction to see if they recognize you.
  - Withdraw toward the propped-open back door to find a quick exit.
  opening_narrative: 'The bitter taste of cheap synthetic stimulant lingers on your
    tongue. A synthesizer in the corner hums with a low, rhythmic vibration, dispensing
    a thick brown liquid into a chipped ceramic cup with a wet, mechanical thud. The
    air in The Rusty Spigot is heavy, thick with the swirling blue smoke from a nearby
    hookah that hangs motionless in the stagnant heat. An out-of-tune piano jangles
    somewhere in the dimness, its melody struggling against the constant, irritating
    cycle of a cooling unit overhead.


    You sit at a scarred card table, watching a marked deck lie discarded near a half-empty
    glass. The back door of the saloon stands propped open by a heavy boot, allowing
    a sliver of the harsh Port Nicholas sunlight to cut through the gloom, illuminating
    dust motes dancing in the air. You try to keep your head low, blending into the
    shadows of the booth, but the atmosphere in the room has shifted from its usual
    lethargy to something sharp and jagged.


    Ricardo Johnston approaches your table, his heavy footsteps echoing against the
    floorboards. He doesn''t sit; he simply stands over you, his face a mask of weary
    tension. He leans in close, the smell of engine grease and stale sweat clinging
    to him. ''They are checking manifests at the north gate, Anthony,'' he whispers,
    his voice barely audible over the piano''s discordant notes. ''The Corporation
    isn''t just looking for contraband anymore; they are looking for people like us.
    They''ve seized three of the local supply skiffs this morning.''


    Before you can respond, the heavy thud of boots hits the floor near the entrance.
    Two militia guards enter, their eyes scanning the room with a predatory precision
    that has nothing to do with maintaining order and everything to do with hunting.
    One of them, a man with a twitchy eye, stops near your table, his hand resting
    heavily on the grip of his baton. He glances at the back door, then back at you,
    his gaze lingering a second too long on your face. Ricardo''s hand tightens on
    the edge of the table, his knuckles turning white. The room goes silent, the only
    sound being the mechanical groan of the cooling unit and the frantic, uneven pulse
    in your own ears. You realize with a sinking feeling that the border clash isn''t
    something happening out there on the frontier anymore; it has just walked through
    the front door.'
  outcome_summary: Ricardo warns of increased Coalition scrutiny while militia guards
    begin a suspicious sweep of the saloon.
