__seed_meta__:
  actions:
  - Examine the jagged edges of the pipe breach for tool marks.
  - Demand that Nathan explain why the militia is guarding the hole instead of helping.
  - Attempt to divert the flow using your surveying equipment and nearby debris.
  - Scan the surrounding boarded-up buildings for any sign of fleeing saboteurs.
  opening_narrative: 'The rhythmic, hollow thud of your boots against cracked asphalt
    is the only sound in the street, save for the persistent buzz of flies circling
    a discarded, half-empty crate of bottled water. You step over a mattress that
    has been dragged halfway across the intersection, its fabric stained by years
    of rain and grit. To your left, a burned-out car sits like a skeletal monument
    to the old world, with thick green saplings erupting through the rusted chassis
    where an engine once hummed. The grocery store windows ahead are boarded up with
    heavy timber, but the front door swings rhythmically in the wind, creaking against
    its frame like a wounded animal.


    You reach the junction where the main water line runs beneath the road, and your
    heart sinks. The ground is saturated, a dark, muddy slurry oozing from a jagged
    fissure in the pavement. It isn''t just a leak; it is a violent eruption of pressurized
    water and silt, tearing through the very foundation of the street. The smell of
    wet earth and ancient, stagnant sediment fills your lungs.


    "Brent! Get back from that edge!" Nathan Goodwin''s voice cuts through the sound
    of rushing water. He is standing ten feet away, his face etched with a mixture
    of exhaustion and fury. He gestures wildly toward the breach, his heavy work boots
    splashing in the growing puddle. Behind him, two militia guards move into position,
    their hands resting on their belts, eyes scanning the surrounding boarded-up buildings
    rather than the hole itself. Nathan looks at you, his eyes searching yours for
    a solution that your maps might provide, but his jaw is set tight. He isn''t just
    looking for a repairman; he is looking for someone to blame for the chaos this
    breach will cause.


    "The pressure is dropping in the north sector," Nathan shouts over the spray of
    water, stepping closer to you. "If we don''t plug this within the hour, the whole
    reservoir is going to drain into the sub-levels. We won''t have enough for the
    nursery by morning." He looks at the guards, then back to you, his voice dropping
    to a desperate whisper. "Tell me you can find where they cut it. Tell me someone
    didn''t do this on purpose."


    The militia guards shift their weight, their eyes darting toward the shadows of
    the swinging grocery store door. One of them grips a heavy iron baton, their posture
    defensive and suspicious. The tension in the air is thicker than the humidity;
    everyone knows that water is more valuable than gold in Adamsville, and someone
    has just stolen the town''s future.'
  outcome_summary: A major water main breach threatens the settlement's supply, leaving
    Brent to investigate potential sabotage.
