__seed_meta__:
  actions:
  - Confront James Luna to demand the data shard immediately.
  - Deflect the militia guards to prevent them from firing on the fugitive.
  - Investigate the movement in the canyon shadows behind the pursuit.
  - Withdraw toward the settlement gates to call for reinforcements.
  opening_narrative: 'The dry scrape of windblown sand against your boots is the only
    constant in the heat. You stand on the edge of the Bentleyport outpost, watching
    the heat shimmer distorting the horizon into a dancing, liquid mess. A rusted
    hull fragment lies half buried in the dust nearby, a relic of a freighter that
    died long before you took this badge. Beside it, a cracked oxygen mask hangs from
    a post, its filter clogged with fine red silt. The creak of metal expanding in
    the blistering noon sun sounds like a slow, rhythmic groan from a dying beast.


    You see a trail marker knocked askew, pointing toward the canyon floor instead
    of the settlement gates. It is a small sign of the chaos that has been creeping
    into the outpost lately. The economic rot has made people desperate, and desperation
    makes them reckless. You can feel the weight of your sidearm against your hip,
    a heavy reminder of a duty that feels increasingly hollow in a town that has forgotten
    how to thrive.


    The silence is broken by a sudden, sharp crack—not the metal expanding, but a
    gunshot echoing from the canyon mouth. Then comes the shouting. James Luna stumbles
    into view, his clothes torn and his breathing shallow through a cracked respirator.
    He is sprinting toward your position, eyes wide with a terror that transcends
    mere exhaustion. Behind him, three militia guards emerge from behind a corrugated
    metal shed, their rifles raised but their movements hesitant. They aren''t looking
    at the fugitive; they are looking at the shadows moving in the dust behind him.


    Raymond Miles steps out from the shade of a nearby hab-unit, his eyes narrowing
    as he spots you. He doesn''t reach for a weapon; instead, he leans against a rusted
    support beam, watching the scene with a calculating gaze that says he has already
    weighed the cost of intervention. "He''s bringing trouble to our doorstep, Deputy,"
    Raymond calls out, his voice cutting through the dry wind. "And the ones following
    him don''t look like they''re here for a chat."


    James collapses a few feet from you, clutching a small, glowing data shard to
    his chest as if it were a holy relic. The militia guards freeze, caught between
    their orders to arrest the fugitive and the sudden movement in the canyon that
    suggests a larger force is approaching. The settlement''s perimeter is thin, the
    people are hungry, and the peace you have worked so hard to maintain is fraying
    at the seams right before your eyes.'
  outcome_summary: James Luna has arrived at the outpost carrying a stolen data shard
    while being pursued by unidentified threats.
