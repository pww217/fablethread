__seed_meta__:
  actions:
  - Confront Frank to demand his side of the story.
  - Attempt to grab the canvas bag from Marvin before he jumps.
  - Use the water tower ladder to descend toward the fire escape.
  - Draw your revolver and prepare for the men ascending the stairs.
  opening_narrative: "The smell of hot tar rises from the rooftop, thick and suffocating\
    \ under the midday sun. You can feel the heat radiating through your soles, making\
    \ every step on this blistering surface a chore. A loose antenna clatters rhythmically\
    \ against a vent nearby, its metallic screeching cutting through the distant,\
    \ rhythmic wail of a police siren rising from the streets below. \n\nThe heist\
    \ went sideways faster than your informants promised. The warehouse on the edge\
    \ of the waterfront is likely still smoldering, and the men you were tracking\
    \ have left a trail of broken glass and spent shell casings leading straight up\
    \ this fire escape. You reach the top, your breath coming in ragged bursts, only\
    \ to find the exit blocked by a gap between buildings that looks much wider from\
    \ this height. \n\nMarvin Stone is there, his back against a rusted water tower.\
    \ He is panting, his eyes darting wildly between you and the ledge. He holds a\
    \ heavy canvas bag against his chest like it's a child. Just as you take a step\
    \ forward, the heavy metal door to the roof bursts open. Frank Miller stumbles\
    \ out, his service revolver drawn and shaking. He doesn't look like the sergeant\
    \ you served with in the trenches; his eyes are hollowed by exhaustion and something\
    \ much darker. \n\n\"Nicholas, stay back!\" Frank shouts, his voice cracking.\
    \ He isn't looking at you; he's looking past you, toward the stairwell. You hear\
    \ the heavy, rhythmic thud of boots on metal—the unmistakable stride of men who\
    \ don't care about precinct boundaries or city permits. John Holloway and two\
    \ other men are coming up the fire escape, their silhouettes cutting sharp against\
    \ the sun. Frank’s aim wavers between you and the twitching Marvin. He knows what's\
    \ in that bag, and he knows that if you take it, your chance at redemption becomes\
    \ a death warrant. The siren from below grows louder, closing in on the block,\
    \ but it feels worlds away from this isolated, burning perch."
  outcome_summary: Marvin Stone holds the stolen union funds on a rooftop while Frank
    Miller stands caught between his past and his duty.
