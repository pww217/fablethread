__seed_meta__:
  actions:
  - Grab the swivel gun and prepare to fire grapeshot.
  - Move to William's side to assist with the helm.
  - Direct Jon to bring more powder to the gun crews.
  - Draw your cutlass and brace for a boarding attempt.
  opening_narrative: "The stinging spray of salt water hits your face like a lash,\
    \ cold and unyielding. You stand on the quarterdeck of the Vanguard, your boots\
    \ slipping slightly on the deck which is slick with sea spray and the sudden downpour.\
    \ Overhead, the snap of heavy canvas echoes like rifle shots as the wind catches\
    \ the mainsail, and the rigging hums under a sudden, violent strain that vibrates\
    \ through the very soles of your feet. The creak of the helm under pressure is\
    \ a constant, groaning protest against the swell.\n\nTo your left, the gimbaled\
    \ brass mount of the ship's compass jerks wildly as the vessel lurches heavily\
    \ to starboard. The swivel gun mounted on the rail sits ready, its iron mouth\
    \ loaded with grapeshot and waiting for the order to bark. The air is thick with\
    \ the smell of wet wood and unwashed men. \n\n\"Steady on the helm!\" William\
    \ Vance bellows, his voice cutting through the roar of the wind. He stands near\
    \ the wheel, his eyes fixed on the dark silhouette emerging from the mist. It\
    \ is no merchantman; the tall masts and disciplined lines of a Royal Navy frigate\
    \ break the gray horizon. The sudden thunder of a broadside erupts from the distance,\
    \ a heavy, rhythmic booming that sends a shudder through the Vanguard's hull.\
    \ \n\n\"Grapeshot! Prepare the swivel!\" William screams, turning his cold, pragmatic\
    \ gaze toward you. He doesn't ask; he commands. Beside him, Jon, the powder monkey,\
    \ darts between the legs of the sailors, a small shadow carrying a heavy pouch\
    \ of black powder with terrifying speed. The boy's face is pale, but his hands\
    \ are steady. \n\nAcross the deck, you see the frantic movement of the crew scrambling\
    \ to the guns. The Navy ship is closing the distance rapidly, their white sails\
    \ cutting through the gloom like ghosts. You can hear the rhythmic shouting of\
    \ their officers over the crashing waves. This isn't a chase; it is an execution.\
    \ William looks at you, his eyes hard and demanding. He knows your history, he\
    \ knows you were once one of them, and right now, he needs to know if you are\
    \ a man of the crew or a liability that will get them all sent to the gallows.\
    \ The first iron ball skips across the water nearby, sending a plume of white\
    \ foam high into the air, and the deck beneath you groans in terror."
  outcome_summary: The Vanguard is caught in the crosshairs of a Royal Navy frigate
    during a sudden storm.
