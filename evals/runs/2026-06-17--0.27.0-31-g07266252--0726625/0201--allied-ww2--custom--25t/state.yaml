__seed_meta__:
  actions:
  - Confirm the exact remaining shell count for the Lieutenant.
  - Argue with Vance about preserving supplies for defense.
  - Help Cook stabilize the radio signal for the destroyer.
  - Check your personal ledger for any overlooked supply discrepancies.
  opening_narrative: 'The sharp smell of cordite and wet earth clings to your clothes,
    a constant reminder of how close the front is. You sit on a crate of empty shell
    casings, your fingers stained with ink and mud as you try to make sense of the
    chaotic scribbles in your ledger. Around you, the trench line is a mess of mud
    choked duckboards and crumbling sandbag parapets that seem to sag more with every
    heavy thud of distant artillery. A periscope rifle rests propped against the edge
    of the trench, its lens reflecting the grey, overcast sky.


    Sergeant David Vance approaches your position, his boots squelching heavily in
    the mire. He does not look at you; he looks past you, toward the valley where
    the fog is beginning to roll in. His face is a mask of exhaustion, but his eyes
    are sharp, scanning the horizon for any sign of movement. Behind him, Corporal
    Andrew Cook is hunched over a radio set, his hands moving frantically over the
    dials as he tries to pierce through the atmospheric interference.


    "Miller," Vance says, his voice barely audible over the rhythmic boom of the guns.
    He finally meets your eyes, and for a second, that shared silence from months
    ago hangs between you both—the memory of that one afternoon when neither of you
    felt like soldiers. "Cook is trying to reach the destroyer off the coast. They
    need coordinates for a pre-emptive strike on the ridge, but we are running dangerously
    low on the heavy shells they want us to spot for."


    Andrew Cook looks up, his expression more anxious than relieved. "The signal is
    weak, Sergeant. If I can''t get a clear line to the ship, any coordination will
    be guesswork. And if we use our remaining flares to mark the target, we won''t
    have anything left for an emergency extraction."


    Vance turns back to you, his jaw tight. "The Lieutenant is breathing down my neck
    for those coordinates. He wants the naval guns to clear that ridge before dawn.
    But if I give him the green light and the ship misses, or if we run out of shells
    halfway through the barrage, this whole sector is wide open. You''re the one who
    knows exactly how many rounds are left in the depot, James. Tell me truthfully—can
    we afford to call for this fire?"'
  outcome_summary: An urgent request for naval bombardment arrives amidst a critical
    shortage of available munitions.
