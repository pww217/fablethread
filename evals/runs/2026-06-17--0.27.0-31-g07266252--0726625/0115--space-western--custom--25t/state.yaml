__seed_meta__:
  actions:
  - Confront Schaefer by explaining the equipment is just scrap
  - Deflect suspicion by offering to pay a processing fee
  - Investigate if the guards are distracted by something nearby
  - Withdraw from the scene before they can search your kit
  opening_narrative: 'The rhythmic, uneven thrum of the ventilation fan vibrates through
    the soles of your boots, a mechanical heartbeat that feels just as tired as you
    do. Somewhere deep in the darkness below, the echo of dripping water punctuates
    the silence between the grinding of ore carts on damaged tracks. You crouch beside
    a drilling rig with its safety guard removed, the naked metal gleaming dully in
    the dim light of the shaft. The air is thick with the smell of wet iron and the
    ozone sting of a malfunctioning power cell.


    You are halfway through stripping a seismic charge when the heavy clatter of armored
    boots shatters the stillness. Two uniformed guards round the corner of the tunnel,
    their flashlight beams cutting through the gloom like blades. Behind them walks
    Jeffrey Schaefer, his uniform crisp despite the grime of the mines, his eyes scanning
    your workspace with a clinical, detached precision. He stops just feet from you,
    his shadow stretching long and imposing across your tools.


    ''Jeremy Rocha,'' Schaefer says, his voice devoid of warmth as he recognizes you.
    He doesn''t wait for a greeting. Instead, he gestures to the seismic charge sitting
    on your workbench—the one with the dead trigger that you were hoping to salvage
    for parts before anyone noticed its illegal status. ''You are working outside
    of sanctioned hours, and this equipment has not been logged in the district registry.''


    The guard on his left rests a hand on his sidearm, his eyes darting between your
    face and the heavy wrench in your hand. You can feel the weight of the situation
    pressing in on you like the mountain itself. If Schaefer finds the charge, he
    won''t just confiscate it; he will impound your entire kit and likely report your
    location to the central precinct. Your cousin Jeffrey always warned you that the
    Coalition was looking for an excuse to tighten their grip on the Annahaven shafts,
    and now, standing in this dim tunnel with his flashlight burning into your eyes,
    you realize he was right.


    Schaefer steps closer, his boots crunching on the grit of the floor. ''This looks
    like more than just scrap, Rocha. This looks like a violation of the mining safety
    act and several trade regulations combined.'' He leans in, his expression unreadable
    but his intent clear. He is waiting for you to slip up, to give him the leverage
    he needs to make an example of a scavenger who thinks the rules don''t apply in
    the dark.'
  outcome_summary: Jeremy Rocha faces a sudden customs inspection while working on
    illegal mining equipment in the Annahaven shafts.
