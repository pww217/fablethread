__seed_meta__:
  actions:
  - Agree to Douglas's terms and investigate the locked ward.
  - Argue that the purge will destroy irreplaceable medicine samples.
  - Search the nearby surgical tray for clues about the syringe contents.
  - Demand to see the patient charts before making a decision.
  opening_narrative: 'The rhythmic, dying hum of a surgical light on backup power
    is the only thing keeping the darkness at bay. It flickers with a nauseating frequency,
    casting long, twitching shadows across a gurney with torn restraints that sits
    abandoned in the center of the room. You can smell it—the cloying, sweet scent
    of rot drifting from a locked ward down the hall, a smell that has become the
    permanent cologne of this dying building.


    You lean over a patient chart, but the paper is water-damaged into illegibility,
    a blur of blue ink and grey mold. Beside your hand, a syringe half-filled with
    something dark and viscous sits on a tray, forgotten by whoever was last desperate
    enough to be here. The air in Saint Marys Infirmary is heavy, thick with the dust
    of a world that stopped functioning twenty years ago.


    A heavy footfall echoes in the corridor, followed by the unmistakable metallic
    click of a safety being disengaged. Douglas Le steps into the pool of flickering
    light, his face a mask of weary authority. He does not look like the man who stood
    shoulder-to-shoulder with you when the breaches first opened; he looks like a
    man who has buried too many friends to care about your sentimentality.


    "The Council found a carrier in the lower wards, Andrew," Douglas says, his voice
    low and devoid of warmth. He gestures toward the locked ward where the smell is
    strongest. "They want this entire wing purged. Incineration protocols are ready
    for activation."


    You look at the syringe, then back to him. You know that ward isn''t just full
    of sickness; it contains the last of the uncorrupted medicine samples, stolen
    from a supply run that was supposed to be yours. If he triggers the purge, the
    medicine—and whoever is hiding inside with it—will be turned to ash.


    "The protocols are for safety, Andrew," Douglas continues, stepping closer, his
    eyes searching yours for a sign of compliance. "But I know you think there is
    a way to save them. If you can prove the contagion isn''t what they say it is,
    I might delay the order. But if you lie to me, and this spreads, I will burn this
    building with both of us inside."


    A guard stands just behind him in the doorway, hand resting on a holster, watching
    your every move with a jittery, uncertain grip. The tension in the room is a physical
    weight, heavier than the stale air. You are caught between the man who saved your
    life and the duty that demands you protect the very people he is willing to sacrifice.'
  outcome_summary: Douglas Le presents a choice between enforcing quarantine protocols
    or risking a contagion outbreak to save medical supplies.
