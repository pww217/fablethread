__seed_meta__:
  actions:
  - Examine the contents of the manila envelope immediately.
  - Ask Patrick O'Malley what he knows about the crime scene.
  - Confront Joseph Vance about his sudden presence here.
  - Scan the room for anyone watching this encounter.
  opening_narrative: 'The smell of stale rye and cheap tobacco clings to the back
    of your throat. In the corner of The Blind Pig, a phonograph skips on a scratched
    record, the rhythmic clicking providing a jagged heartbeat to the low laughter
    drifting from the back room. You sit at a corner table, eyes tracing the worn
    brass rail where decades of desperate hands have smoothed the metal. The air is
    thick with a haze of blue cigarette smoke that obscures the faces of the men huddled
    near the bar.


    A sudden silence falls over the room as Joseph Vance steps through the heavy curtained
    entrance. He does not look like a man on official business; his coat is rumpled
    and his eyes are darting toward the exit. Behind him, Patrick O''Malley follows,
    his face a mask of grim tension. They do not head for the bar. Instead, they move
    directly toward your table, their shadows stretching long across the floorboards
    under the dim amber lamps.


    Vance drops a heavy manila envelope onto your table, right next to your half-empty
    glass. The clink of his heavy ring against the wood sounds like a gavel. ''The
    treasurer was found in the alley behind the laundromat,'' Vance says, his voice
    low and raspy. ''No eyes on him, no witnesses, just a hole in his chest and this.''
    He taps the envelope. Patrick O''Malley leans over, his large hands gripping the
    edge of your table so hard his knuckles turn white. ''The South Robert boys are
    already claiming it was a territory warning,'' Patrick growls, his eyes searching
    yours for a glimmer of the man you used to be. ''If this is a union matter, Ben,
    you need to handle it before the precinct tries to bury it.'' The tension in the
    room is palpable; even the bartender has stopped wiping the counter, frozen by
    the sight of two men bringing death into a sanctuary of shadows.'
  outcome_summary: A union treasurer lies dead in an alleyway, sparking a potential
    gang war and a frantic investigation.
