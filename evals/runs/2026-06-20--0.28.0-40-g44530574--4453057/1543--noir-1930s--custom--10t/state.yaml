__seed_meta__:
  actions:
  - Confront Matthew about the discrepancy in the witness statements.
  - Deflect his warning and ask him for help accessing the padlocked drawer.
  - Quickly slide the incriminating photograph into your notebook to hide it.
  - Investigate the teletype machine for any recent, unexplained printouts.
  opening_narrative: 'The heavy, metallic scent of wet wool and stale coffee hangs
    thick in the air, clinging to the back of your throat. You sit at a scarred wooden
    desk, the rhythmic, aggressive clatter of the teletype machine providing a relentless
    heartbeat to the silence of the precinct records room. Smoke from a dozen forgotten
    cigarettes curls lazily under the flickering ceiling lights, creating hazy islands
    in the dimness. The floor beneath your boots is slick, stained by the rain that
    has been tracking in from the streets all evening, leaving dark, muddy patches
    near the heavy iron door.


    You stare down at the file spread before you, but your eyes keep drifting to the
    padlocked bottom drawer of the filing cabinet across the room. It stands there
    like a silent sentry, guarding secrets that don''t belong in a public ledger.
    You know what you saw earlier—the way the ink on the witness statement looked
    too fresh, too deliberate, as if someone had sat here just an hour ago with a
    fountain pen and a heavy conscience. The official report says the suspect was
    alone, but the photograph tucked into your pocket tells a different story, one
    involving two men and a struggle that never made it into the paper.


    The door creaks open, and the heavy tread of boots echoes against the linoleum.
    Matthew Ross walks in, his shoulders slumped under the weight of his overcoat.
    He doesn''t look at you at first; he just heads for the coffee urn, his movements
    slow and heavy, like a man walking through deep water. He looks older than he
    did when you were both digging foxholes in France, the lines around his eyes etched
    deep by years of seeing things that cannot be unseen.


    ''You should be home, Robert,'' Matthew says, his voice a low rasp that barely
    carries over the teletype''s chatter. He pours a cup of coffee, the liquid dark
    and oily, and finally turns to face you. His eyes linger on the document you are
    holding, and for a second, the weary mask slips, revealing a flash of something
    sharp and panicked. He steps closer, leaning his hands on your desk, his shadow
    stretching long and jagged across your paperwork. ''Some things are better left
    unread. Some mistakes are easier to live with if they stay buried in the archives.''


    He isn''t talking about the weather. He is looking directly at the discrepancy
    you just uncovered, and the silence that follows is heavier than the rain outside.
    You can see the tension in his jaw, the way his fingers twitch near his holster.
    He is a man caught between the loyalty he owes a brother-in-arms and the duty
    he owes a system that is clearly rotting from the inside out. Outside, a heavy
    rain begins to lash against the windowpanes, punctuating the tension of the room.
    You realize then that Matthew isn''t just here to tell you to go home; he is here
    to see if you have already seen too much.'
  outcome_summary: Robert faces a direct confrontation with Matthew Ross regarding
    the suspicious alterations in the homicide files.
