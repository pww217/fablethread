__seed_meta__:
  actions:
  - Intercept the envelope before it slides off the roof edge.
  - Confront Thomas Vance about his sudden interest in Clark's files.
  - Attempt to leap across the gap to reach Clark Harris.
  - Draw your revolver and demand both men stand down.
  opening_narrative: 'The smell of hot tar rises from the blistering roof, thick and
    suffocating under the midday sun. You steady your breathing, feeling the grit
    of industrial soot beneath your palms as you crouch near the edge of the Spearsport
    warehouse. Below, the distant wail of a police siren cuts through the heavy air,
    a lonely sound that underscores the silence of this high-altitude wasteland. A
    loose antenna clatters violently in a sudden gust of wind, sounding like a frantic
    heartbeat against the metal housing.


    You aren''t supposed to be up here. As a union investigator, your jurisdiction
    ends at the street level or inside the union halls, but the information Clark
    Harris whispered to you before he vanished changed everything. He didn''t just
    hand you a lead; he handed you a death sentence wrapped in newsprint. Now, looking
    across the gap between this building and the next, the distance looks much wider
    than it did from the street. The fire escape on the adjacent structure ends abruptly
    six feet short of your current position, a jagged iron limb reaching for a ledge
    it will never touch.


    A frantic scuffle breaks out near the water tower. Clark Harris bursts through
    the heavy metal door leading to the roof, his eyes wide and wild, clutching a
    manila envelope to his chest like it was a holy relic. He looks less like a journalist
    and more like a cornered animal. Behind him, Thomas Vance emerges, his massive
    frame silhouetted against the bright sky. Vance isn''t running; he is stalking,
    his heavy boots thudding rhythmically on the tarred surface. His face is set in
    a grim mask of duty, though his eyes flicker with a frantic energy that contradicts
    his steady pace.


    "Give it here, Clark!" Vance bellows, his voice cutting through the wind. "The
    union can''t have this mess turning into a circus! We handle this internally!"


    Clark doesn''t stop. He lunges toward your position, his eyes locking onto yours
    for a split second—a look of desperate recognition and terror. He knows you are
    the only one who can read what is inside that envelope without selling it to the
    highest bidder or burying it in a headline. He trips on a loose patch of roofing
    material, the envelope slipping from his grasp and sliding toward the edge of
    the roof. At the same time, Vance reaches for his heavy coat pocket, his hand
    closing around something substantial and metallic. The gap between you and Clark
    is growing, and the distance to the next building feels like an abyss. You have
    seconds to decide if you are going to protect the truth or let it fall into the
    shadows of the docks below.'
  outcome_summary: Clark Harris has lost control of the incriminating documents during
    a frantic rooftop confrontation with Thomas Vance.
