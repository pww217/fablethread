__seed_meta__:
  actions:
  - Confront Scott about his sudden fear of the militia tracks.
  - Investigate the bolted root cellar door before the drones arrive.
  - Withdraw toward the treeline to avoid detection by the patrol.
  - Use your knowledge of old-world logistics to find a hidden cache.
  opening_narrative: 'The rhythmic rustle of dry corn stalks in the wind is the only
    sound breaking the heavy heat of the afternoon. You lean against a tractor with
    its battery pulled long ago, the metal hot and pitted beneath your palms. The
    air smells of dust and something sharper—the metallic tang of approaching rain
    that will never actually arrive to wash away the grime.


    To your left, the fence line is down in three places, letting the weeds and thistle
    creep further into what used to be a managed field. You scan the perimeter, eyes
    searching for any sign of movement that isn''t the wind-blown stalks. This sector
    was supposed to be empty, a dead zone between the settlement and the military
    checkpoints, but the silence feels wrong today. It is too heavy, weighted by the
    knowledge that every scrap you find here is being watched.


    Scott Baxter emerges from behind a cluster of overgrown bushes, his eyes darting
    toward the broken fence line before settling on you. He isn''t carrying much,
    just a tattered satchel and a look of intense agitation that makes your chest
    tighten. He doesn''t wait for you to speak; he simply points toward the root cellar
    door down the slope, which has been bolted from the outside with heavy iron bars.


    "They were here, Morgan," Scott says, his voice low and jagged. "I saw the tracks
    near the wellhead. Not scavenger tracks—these were heavy, rhythmic. Militia boots."


    He moves closer, his hand resting nervously on the hilt of a rusted knife at his
    belt. He looks less like a partner and more like a man who is ready to bolt if
    things turn south. "They didn''t just pass through. They took the crates we marked
    for the enclave. The ones with the filtration mesh."


    A low, rhythmic thumping begins to vibrate through the ground—the distant, unmistakable
    drone of an automated patrol unit approaching from the north. It isn''t a passing
    shadow; it is a directed movement. Scott grips your arm, his knuckles white. "If
    they find us here scavenging without a pass, they won''t just take the supplies.
    They''ll take us to the processing center in Port Lori."


    You look from Scott to the bolted cellar door. The tension between the need for
    those filters and the threat of the approaching patrol pulls at you like a physical
    weight. If you head for the cellar, you might find what was stolen, but you''ll
    be caught in the open when the drones arrive. If you retreat now, the enclave
    goes without clean water by morning.


    Scott''s eyes are wide, searching yours for a decision. He is waiting for your
    signal, the one you''ve used a hundred times before, but for the first time, the
    signal feels like it might be a death sentence.'
  outcome_summary: Morgan and Scott find themselves caught between a stolen supply
    cache and an approaching militia patrol.
