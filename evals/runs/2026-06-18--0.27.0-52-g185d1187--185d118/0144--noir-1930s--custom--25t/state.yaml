__seed_meta__:
  actions:
  - Slide the stolen ledger page into my inner coat pocket.
  - Ask Moran why he is so concerned with my paperwork.
  - Scan the room to see if Vance witnessed our encounter.
  - Demand to know who authorized the recent payroll changes.
  opening_narrative: 'The rhythmic clatter of a typewriter with a stuck ''e'' key
    punctuates the heavy silence of the Fourth Precinct. Rainwater drips from your
    trench coat onto the floor, adding to the slick, dark patches reflecting the dim
    overhead lights. The air in the room is thick, a suffocating mix of stale coffee
    and the blue smoke hanging under the ceiling lamps like a low-lying fog.


    You sit at a scarred wooden desk, the stained page of the union ledger feeling
    heavy and illicit against your palm. Across the room, Andrew Vance is hunched
    over his station, his fingers moving mechanically through a stack of summonses,
    his face a mask of weary indifference to the chaos of the city outside. The precinct
    feels unusually quiet, yet there is an underlying vibration of tension that makes
    the hair on your neck stand up.


    A heavy footfall breaks the stillness. Detective Sean Moran rounds the corner,
    his eyes immediately locking onto yours with a sharp, predatory stillness. He
    doesn''t walk toward you so much as he closes the distance, his presence cutting
    through the haze of smoke like a blade. He stops just short of your desk, leaning
    forward so that the light catches the hardness in his gaze.


    ''You shouldn''t be digging in those files, Halloway,'' Moran says, his voice
    low and devoid of warmth. He doesn''t look at the ledger, but his eyes scan your
    face for any sign of hesitation. ''Some things in this precinct are better left
    in the bottom drawer.'' Behind him, Vance stops typing, the sudden silence of
    the machine feeling louder than the noise ever did. Moran reaches out, resting
    a heavy hand on the edge of your desk, his knuckles white. He isn''t making a
    threat yet, but the implication hangs in the air between you, more potent than
    any spoken warning. You realize then that the discrepancy you found in the payroll
    wasn''t just a mistake—it was a breadcrumb leading straight into a trap.'
  outcome_summary: William Halloway discovers a suspicious ledger page while being
    confronted by Detective Moran in the precinct.
