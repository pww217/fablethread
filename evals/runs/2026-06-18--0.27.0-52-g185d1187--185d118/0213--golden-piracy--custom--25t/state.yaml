__seed_meta__:
  actions:
  - Confront Jay about the risks of raiding the apothecary during a strike.
  - Deflect the tension by suggesting a more discreet way to bypass the naval patrols.
  - Investigate the smashed sea chest for anything useful before the tide rises.
  - Withdraw from the discussion to prepare your gear for a potential raid.
  opening_narrative: 'The hiss of waves on shingle is the only sound breaking the
    heavy silence of the cove. You stand on the damp sand, your boots sinking slightly
    as the tide begins its relentless push toward the shore. To your left, a longboat
    sits skewed against a cluster of rocks, half-filled with stolen crates that rattle
    with every surge of the sea. Nearby, a sea chest lies partially submerged, its
    heavy iron lock smashed into splinters, spilling a few useless scraps of soaked
    parchment into the surf. The air is thick, not just with the salt spray, but with
    a cloying, sickly sweetness that clings to the back of your throat—the smell of
    the fever that has been thinning your crew''s ranks for a week.


    Jay stands ten paces away, his eyes fixed on the horizon where the silhouette
    of a colonial patrol cutter looms through the morning mist. He is gripping his
    heavy cane so tightly his knuckles are white, his face a mask of grim determination.
    He doesn''t look at you, but his voice cuts through the cry of gulls overhead
    like a blade. ''The port is closed, James. The sailors in town have laid down
    their tools, and the Governor has turned the docks into a graveyard for anyone
    showing a cough.'' He finally turns to you, his eyes hard. ''If we don''t get
    those tinctures from the apothecary before the patrol ships sweep this cove, half
    our men won''t see the next moon.''


    Beside him, Daniel is kneeling by a pile of soaked gear, his hands trembling slightly
    as he cleans a small scalpel with a rag that is more grey than white. He looks
    up, his eyes sunken and shadowed. ''It is not just the strike, Quartermaster,''
    Daniel mutters, his voice raspy. ''The infection is moving faster than the news.
    I saw a man collapse near the landing yesterday, and by noon, his skin was already
    mottled with the red bloom.'' He looks at you, his gaze searching for a solution
    he knows you cannot easily provide. ''We need more than just medicine; we need
    a way into North Johnmouth that doesn''t involve a ten day wait in a filth ridden
    quarantine tent.''


    Jay steps closer, his presence commanding even in this desolate place. He gestures
    toward the smashed chest. ''The crew is restless. They see the sickness, they
    see the port blocked, and they see us sitting here like sitting ducks while our
    brothers rot. Some are whispering that we should raid a merchant vessel instead
    of playing doctor. They think discipline is a luxury we can no longer afford.''
    He leans in, his voice dropping to a low, dangerous growl. ''I need you to lead
    a small party. We slip into the harbor under the cover of the strike''s chaos.
    We take what we need from the apothecary and get out before the naval patrols
    realize we''ve bypassed the checkpoint. If you''re caught, I can''t protect you.
    If you fail, there won''t be a crew left to command.''


    The tension is a physical weight, pressing down on you more heavily than the damp
    air. The tide is coming in fast now, licking at your boots, and the reality of
    the choice sits between you like a sharpened cutlass. You can follow Jay''s plan
    and risk a direct confrontation with the colonial authorities, or you can listen
    to the growing resentment of a crew that is increasingly willing to trade loyalty
    for survival.'
  outcome_summary: James Gregory stands in a sheltered cove, tasked with securing
    medicine amidst a port strike and a spreading quarantine.
