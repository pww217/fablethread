__seed_meta__:
  actions:
  - Present my Guild credentials and demand a manual weight verification.
  - Attempt to deflect Garcia by citing the known density fluctuations in this sector.
  - Quietly signal the guards to keep their eyes on the perimeter.
  - Check the cargo manifest on my data pad for any possible clerical errors.
  opening_narrative: 'The dry scrape of windblown sand against your visor is the only
    sound in the oppressive heat. You stand before the heavy blast doors of the Cisneroston
    Checkpoint, the heat shimmer distorting the horizon into a dancing, golden haze.
    A rusted hull fragment half-buried in the dust nearby serves as a grim reminder
    of the last freighter that failed its inspection. To your left, a cracked oxygen
    mask hangs from a post, its glass clouded by years of grit and neglect.


    Robert Garcia stands behind the reinforced glass of the inspection booth, his
    face a mask of weary professionalism. He doesn''t look up as you approach; he
    is busy tapping rhythmically on a terminal, the sound echoing through the metal
    structure. The creak of metal expanding in the heat punctuates the silence between
    his keystrokes. Two armed guards stand motionless behind him, their rifles held
    across their chests in a posture of practiced indifference. They are not looking
    at you; they are looking past you, scanning the empty desert for any sign of unauthorized
    movement.


    "Becker," Garcia says without lifting his eyes. The name is flat, devoid of the
    warmth that once existed between you during your time on the front lines. He finally
    looks up, his eyes squinting against the glare. "Your Guild credentials are valid,
    but your cargo manifest has a discrepancy. The weight readings for the silicate
    crates don''t match the density profiles listed in your permit."


    He gestures toward the heavy container being unloaded from your transport. It
    sits on the landing pad, vibrating slightly as the automated crane shifts its
    weight. You know what is inside that crate—it isn''t just ore. It is something
    else entirely, something the Coalition hasn''t officially acknowledged yet. If
    Garcia runs a deep scan, the diplomatic implications could be catastrophic. The
    tension in the air is thick enough to choke on, more suffocating than the desert
    heat. The guards shift their weight, their eyes finally settling on you, waiting
    for your response to the inspector''s accusation.'
  outcome_summary: Joshua Becker faces a critical customs inspection that threatens
    to expose his sensitive cargo and trigger a diplomatic incident.
