__seed_meta__:
  actions:
  - Broadcast an urgent distress signal through the radio handset.
  - Assist Vance in maintaining his position near the bridge edge.
  - Provide cover fire for Sergeant Stone near the swaying pontoon.
  - Scout the immediate fog-covered bank to identify the attackers.
  opening_narrative: 'The rhythmic creak of ropes under tension is the only thing
    cutting through the heavy, damp silence of the morning. You can feel the moisture
    from the low-lying fog settling on your skin, making your wool uniform feel heavy
    and uncomfortably cold. Ahead, the pontoon bridge groans as a heavy transport
    truck crawls across, its tires splashing through the shallow runoff near the edge
    of the planks. The rush of the river below is a constant, low roar, partially
    masked by the thick grey mist that turns the world into a series of indistinct
    shapes and muffled sounds.


    You are hunkered down near the edge of the crossing, your SCR-536 handset heavy
    in your hands. Beside you, Corporal Nicholas Vance is struggling to keep his headset
    steady, his face pale beneath the grime of the trail. He glances at you, his eyes
    darting toward the jagged scar running along his jawline—a reminder of the engagement
    near East Adam where you had to drag him from a burning transport. He looks like
    he might be sick, his breathing shallow and uneven in the damp air.


    ''Harry, the signal is breaking up,'' Vance whispers, his voice tight with an
    anxiety he can barely suppress. ''I keep getting these bursts of static, but it
    doesn''t sound like atmospheric interference. It sounds like... intentional.''


    You don''t have time to respond. A sudden, sharp crack echoes from the far bank,
    followed by the heavy thud of something hitting the wooden slats of the bridge.
    Sergeant Alexander Stone, standing near the lead truck, immediately unslings his
    rifle, his face set in a mask of grim, unfeeling efficiency. He doesn''t shout
    for help; he simply moves toward the source of the sound, his eyes fixed on the
    fog-shrouded treeline across the water.


    The driver of the second truck screams as a sudden explosion near the bridge anchoring
    ropes sends a spray of splinters and river water into the air. The pontoon section
    shifts violently, swaying under the weight of the stalled vehicles. Through the
    mist, you see the silhouette of men moving—not in the orderly lines of your own
    unit, but in jagged, unpredictable bursts of motion. They aren''t shouting military
    commands; they are moving with a predatory silence that makes the hair on your
    neck stand up.


    Stone turns back to you, his voice a low, commanding growl. ''Miller! Get that
    radio working and find out if any other units are in the sector! Vance, get your
    head out of the clouds and watch the flank!'' He doesn''t wait for your acknowledgment,
    already pivoting to cover the driver who is frantically trying to reverse the
    stalled truck away from the swaying bridge edge. The convoy, meant to be a routine
    transport of fuel and rations, has become a stationary target in the middle of
    a fast-moving river, and the fog is making it impossible to tell friend from foe.'
  outcome_summary: The supply convoy is under sudden attack during a foggy river crossing,
    leaving the unit disorganized and vulnerable.
