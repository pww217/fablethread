__seed_meta__:
  actions:
  - Confront Vance about his plan to maintain order through force.
  - Advocate for the raid to secure the silver before the rivals arrive.
  - Investigate the scratched lock on the dispatch box for clues.
  - Secure the cabin equipment to prevent more damage from the swell.
  opening_narrative: "The heavy scent of gunpowder and spilled Madeira hangs thick\
    \ in the air, fighting against the brine-soaked wind that howls through the deck\
    \ seams. You feel the cabin lurch violently to starboard, a sickening tilt that\
    \ sends a heavy sea chart sliding across the desk, its red ink corrections streaking\
    \ like fresh blood. Water drips rhythmically from a seam above your head, each\
    \ splash a reminder of the hull's struggle against the mounting gale.\n\nJames\
    \ Vance stands by the bolted table, his knuckles white as he grips the edge to\
    \ steady himself against the rolling swell. He is not looking at the sea; his\
    \ eyes are fixed on you, hard and unyielding despite the chaos outside. The lock\
    \ on the dispatch box beside him has been scratched raw, a frantic mark of recent\
    \ tampering that suggests someone was searching for something they shouldn't have\
    \ found. Across from him, Thomas Lowe is hunched over a small medical kit, his\
    \ hands moving with practiced, weary efficiency as he tries to secure his tools\
    \ against the ship's erratic motion.\n\n\"The gale is worsening, Marcus,\" Vance\
    \ shouts over the roar of the wind hitting the hull. \"And the crew is more concerned\
    \ with the merchant prize we spotted off the coast than they are with the storm.\
    \ They want the raid, even if it means running straight into a Navy blockade.\"\
    \ He slams a heavy hand on the table, his voice dropping to a low, dangerous growl.\
    \ \"If we veer toward the coast to chase that gold, we risk more than just the\
    \ weather. We risk every soul on this ship being hanged for piracy before the\
    \ sun rises.\"\n\nThomas Lowe looks up, his face a mask of grim resignation. \"\
    Let them chase it,\" he mutters, his voice cutting through the din. \"A man with\
    \ an empty belly is more dangerous than a Navy frigate. But if we hit those shallows\
    \ in this weather, I won't be able to stitch enough men back together to make\
    \ up for the loss.\" \n\nVance ignores him, stepping closer into your personal\
    \ space, his presence heavy and demanding. \"The Articles are clear on raiding\
    \ under heavy weather, but the crew is looking to you to decide if we fight the\
    \ sea or the Navy. We have a choice: we steer into the teeth of this storm to\
    \ strike the merchant vessel before they reach the safety of the shallows, or\
    \ we turn tail and lose our chance at the haul forever. If we strike, we might\
    \ get the silver, but we'll be fighting both the waves and the blockade.\" \n\n\
    A massive wave slams into the side of the Vengeance, causing the entire cabin\
    \ to groan in protest. The lantern overhead swings wildly, casting long, frantic\
    \ shadows against the timber walls. Through the small, salt-crusted porthole,\
    \ you see a flash of white sail on the horizon—the rival crew is moving fast,\
    \ and they aren't waiting for the weather to clear."
  outcome_summary: A violent storm and an approaching rival crew force a decision
    between a risky coastal raid or a safe retreat.
