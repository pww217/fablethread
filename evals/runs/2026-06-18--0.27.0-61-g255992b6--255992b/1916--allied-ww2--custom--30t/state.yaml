__seed_meta__:
  actions:
  - Dive behind the heavy wooden desk to seek cover.
  - Shout instructions to Anthony Vance to secure the morphine supplies.
  - Grab your M1 Garand and peer through the canvas slit.
  - Attempt to send a frantic distress signal on the radio.
  opening_narrative: 'The hiss of a low-fuel lantern is the only steady sound in the
    room, cutting through the heavy, humid air of the barn. You sit hunched over your
    radio kit, the smell of ozone and unwashed bodies thick enough to taste. On the
    triage table just feet away, blood-soaked sawdust clings to the floorboards, absorbing
    the slow drip from a fresh wound. A clipboard sits nearby, its pages fluttering
    slightly in the draft, covered in morphine doses signed by hands that were shaking
    when they wrote them. The light flickers, casting long, erratic shadows against
    the canvas walls that separate this small sanctuary from the chaos of the field.


    You are trying to tune the frequency, your fingers moving with practiced precision
    despite the chill, when the world suddenly fractures. A sudden burst of machine
    gun fire erupts from the tree line outside, sharp and rhythmic, tearing through
    the silence of the Marshmouth outskirts. The sound is followed immediately by
    a frantic shouting from the perimeter sentries. Dust shakes loose from the barn
    rafters, coating your radio equipment in a fine gray powder.


    Anthony Vance lunges across the triage table, his hands stained with antiseptic
    and dried blood. He doesn''t look at you; he looks toward the door, his eyes wide
    and hollowed by exhaustion. ''Get down!'' he screams over the sudden rattle of
    small arms fire hitting the wooden siding of the barn. One of the orderlies trips
    over a discarded crate, letting out a sharp yelp that is swallowed by a nearby
    explosion. The lantern on your desk wobbles dangerously, its flame dancing wildly
    as the floor vibrates from a heavy impact just outside the entrance. You realize
    with a jolt of adrenaline that the perimeter has been breached, and the very people
    you were supposed to be calling for help are now the ones in immediate peril.'
  outcome_summary: A sudden enemy raid has compromised the field hospital, leaving
    medical staff and communications personnel exposed.
