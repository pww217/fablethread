__seed_meta__:
  actions:
  - Examine the singed ledger for specific names.
  - Ask Vance how much the commissioner actually knows.
  - Demand James Riley step back and give me space.
  - Check the crime scene photo for any overlooked details.
  opening_narrative: 'The heavy scent of stale coffee and cheap tobacco clings to
    the humid air of the Fourth District precinct. Above you, a single ceiling light
    flickers rhythmically, casting long, twitchy shadows across the floor, which is
    slick from the rain tracked in by a dozen wet coats. The constant, mechanical
    clatter of a typewriter with a stuck ''e'' key provides a staccato heartbeat to
    the room, punctuated only by the distant, frantic tapping of the teletype machine
    in the corner. You sit on a wooden chair that creaks under your weight, feeling
    the dampness of your own coat through your shirt.


    Detective Scott Vance leans over your desk, his face a map of exhausted lines
    and shadow. He drops a manila folder onto the scarred wood between you, the sound
    sharp as a gunshot in the cramped office. Beside him, Officer James Riley stands
    rigid, his eyes darting toward the door every time a heavy boot thuds in the hallway.
    Vance doesn''t look at the file; he looks at you, his expression unreadable under
    the dim light.


    "The warehouse on Fourth and Main is a charred skeleton, Anthony," Vance says,
    his voice low and raspy. "The boys from the north side are claiming it was a botched
    raid by your old union associates, but the fire started from the inside out. We
    found this in the rubble."


    Vance pushes a single, singed document toward you. It is a ledger, partially blackened
    by flame, but the names on the last page are still legible. They belong to the
    very men who control the dockyard boundaries—men who have been pushing deeper
    into the precinct''s territory for weeks. James Riley shifts his weight, his hand
    resting uncomfortably close to his holster. "If we file this as arson, the north
    side will burn the south side down just to prove a point," Riley adds, his voice
    tight with an ambition that borders on nervous energy. "But if we sit on it, the
    commissioner will have our heads for ignoring a direct threat to the district."


    Vance leans closer, his eyes searching yours for something more than just a professional
    reaction. He is waiting to see if you will play the role of the impartial investigator
    or if the debt you owe him will force your hand. The tension in the room is thick,
    a physical weight that makes the air feel even heavier than the smoke hanging
    under the ceiling lights. You can feel the weight of the Colt Detective Special
    in your pocket, a cold reminder of the thin line between finding the truth and
    becoming part of the chaos.'
  outcome_summary: A singed ledger recovered from a warehouse arson points toward
    a gang conflict involving dockyard territories.
