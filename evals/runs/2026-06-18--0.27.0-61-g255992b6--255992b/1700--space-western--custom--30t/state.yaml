__seed_meta__:
  actions:
  - Offer Ricardo a bribe to overlook the missing seals.
  - Explain the manifest discrepancy using your technical knowledge.
  - Attempt to hide the contraband before the guards can scan it.
  - Demand to see the official inspection warrant immediately.
  opening_narrative: 'The rhythmic hiss of atmosphere cycling through the scrubbers
    is the only sound in the cramped cargo bay, a constant reminder that the air here
    is borrowed. You can feel the biting chill as the bay depressurizes for the docking
    cycle, making your breath bloom in thin, white clouds under the flickering emergency
    lighting. A grav pallet sits nearby, its levitator broken and tilting uselessly
    to one side, surrounded by a mess of loose and tangled cargo netting that looks
    like it was torn apart in a hurry.


    Ricardo Smith steps into the light, his Coalition uniform crisp despite the grime
    of New Rickyfort. He doesn''t look at your face; he looks at the manifest, then
    at the heavy crates stowed behind the damaged pallet. Behind him, two armed guards
    stand motionless, their hands resting near their sidearms as they scan the shadows
    of the bay. The air feels heavy, not just from the pressure change, but from the
    weight of a history you both thought was buried under layers of official paperwork.


    ''You are running late, Andrew,'' Ricardo says, his voice devoid of warmth. He
    taps a stylus against his datapad, the sound echoing sharply in the hollow space.
    ''And your manifest is missing the secondary stabilization seals for these catalysts.
    That is a Class Four violation.''


    He looks up then, his eyes meeting yours with a look that isn''t quite accusation,
    but it certainly isn''t friendship. He knows exactly what is hidden beneath those
    crates—the same kind of cargo that kept both of you fed when the rim was nothing
    but dust and desperation. One of the guards shifts their weight, the metal of
    their boots clanking against the deck plating, a sound that feels much too loud
    in the silence. The tension is a physical thing, pulling tight between you like
    a fraying cable. Ricardo leans in closer, lowering his voice so the guards can''t
    hear, but his eyes remain as cold as the depressurizing air. ''I can look the
    other way for a fee, or I can call for a full sweep. You know how the Coalition
    is feeling about these terraforming shipments lately. They are looking for any
    excuse to tighten the noose.''


    You realize then that the lockdown isn''t just about resources; it is about control.
    Every breath taken in this sector is being monitored, every shipment scrutinized.
    If they find what you are carrying, it won''t just be your ship they seize—it
    will be your life.'
  outcome_summary: A Customs inspection by Ricardo Smith puts the illegal cargo under
    immediate scrutiny.
