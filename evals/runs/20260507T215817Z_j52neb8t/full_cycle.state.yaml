compendium:
  npcs:
    caron:
      bio: A portly man in his sixties with a merchant's ledger and a patient demeanor.
        You owe him 500 credits from a failed venture three years ago.
      last_seen:
        last_seen_state: ''
        location_id: marrows_crossing
        location_name: Marrow's Crossing
        turn: 2
      name: Caron
      title: Old creditor
    halden:
      bio: A road merchant in his fifties who hires couriers when his usual runners
        are spoken for. Honest by reputation, careful with money.
      name: Halden
      title: Merchant
    innkeeper:
      bio: Runs the inn alone since her husband died. Knows every traveler by face
        if not by name. Stays out of trouble unless it walks through her door.
      name: Edda
      title: Innkeeper at the Crossed Keys
    matthew_estrada:
      bio: A tall, broad-shoulded man in a stained leather jerkin carrying a heavy
        rucksack. Looks like a road runner but moves with military precision.
      name: Matthew Estrada
      title: Traveler
    tough_a:
      bio: Hired muscle. No personal stake in this — he'll back off if the price is
        right or the fight goes bad.
      name: Bald Tough
      title: Road thug
    tough_b:
      bio: Same outfit as the other — hired by the same person. Quicker to violence;
        not the brains.
      name: Scarred Tough
      title: Road thug
