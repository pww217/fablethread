__seed_meta__:
  actions:
  - Attempt to hide the cracked plasma cutter before Jackson sees it.
  - Argue with Officer Jackson about the necessity of the repair.
  - Ask Jesse Trujillo to distract the officers while you finish the diagnostic.
  - Quickly shut down the diagnostic tablet and clear the workspace.
  opening_narrative: "The sharp, metallic tang of ozone bites at the back of your\
    \ throat. A low, rhythmic hiss from a cracked plasma cutter is the only sound\
    \ in the bay, punctuating the heavy silence of the unheated hangar. You are hunched\
    \ over the exposed guts of your freighter, the diagnostic tablet in your hand\
    \ bleeding angry red light across your vision as it screams about critical system\
    \ failures.\n\nThe repair bay is freezing, the warmth having escaped the moment\
    \ the vacuum seal on the primary bulkhead failed an hour ago. Tools are scattered\
    \ across the deck plating like discarded bones, and a recent electrical fire has\
    \ left a dark, soot-stained smear across the bulkhead behind you. You try to focus\
    \ on the wiring, but the shivering in your hands makes the delicate work nearly\
    \ impossible. \n\nA heavy boot thuds against the metal floor, echoing too loudly\
    \ in the cavernous space. You look up to see Jesse Trujillo leaning against a\
    \ stack of empty shipping crates. He looks tired, his face etched with the grime\
    \ of a man who has spent too many cycles breathing recycled air. He does not look\
    \ at you; instead, he watches the door, his hand resting uncomfortably close to\
    \ the heavy wrench tucked into his belt.\n\n\"You are pushing your luck, Jeffery,\"\
    \ Jesse says, his voice rasping. \"The Port Kimberly authorities are running a\
    \ sweep of all independent bays. They are looking for anyone running uncertified\
    \ hardware. If they catch you using that cutter without a permit, they will impound\
    \ the ship before you can even finish the diagnostic.\"\n\nBefore you can respond,\
    \ the heavy sliding door at the end of the bay groans open. The light from the\
    \ corridor spills in, casting long, distorted shadows across the grease-stained\
    \ floor. Two figures stand framed in the doorway, their silhouettes sharp and\
    \ imposing. One of them is holding a handheld scanner that begins to chirp rhythmically,\
    \ its light sweeping across your workspace.\n\n\"Unauthorized maintenance detected\
    \ in Bay Alpha,\" a voice calls out, cold and devoid of empathy. It is Billy Jackson,\
    \ one of the Port Security officers. He steps into the bay, his eyes scanning\
    \ the mess of tools and the smoking diagnostic tablet. Behind him, an assistant\
    \ follows, already tapping commands into a handheld terminal. \n\nJesse stiffens,\
    \ stepping slightly between you and the approaching officers. \"We are just clearing\
    \ a mechanical fault, Officer,\" Jesse says, his voice steady despite the tension\
    \ in his shoulders. \"Nothing that requires a full inspection.\"\n\nJackson does\
    \ not slow down. He moves toward your workbench, the scanner chirping faster as\
    \ it nears your cracked plasma cutter. \"All repairs must be logged and certified\
    \ by a corporate technician,\" Jackson says, his gaze landing on the red warnings\
    \ flashing on your tablet. \"You are in violation of Port Kimberly maritime law.\
    \ Step away from the vessel while we conduct a formal assessment.\"\n\nYour heart\
    \ hammers against your ribs. If they impound the ship, you lose everything—the\
    \ cargo, the fuel, and the chance to clear the debt that has been suffocating\
    \ you for months. Jesse looks at you, a silent plea in his eyes. He knows what\
    \ an impoundment means for a pilot like you. You are caught between the law, your\
    \ mounting debts, and the desperate need to keep your ship flight-ready."
  outcome_summary: Jeffery Cherry faces an immediate inspection by Port Security while
    attempting uncertified repairs in a freezing hangar.
