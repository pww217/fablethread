__seed_meta__:
  actions:
  - Cover Clark while he stabilizes the wounded private.
  - Urge Stone to move toward the tree line immediately.
  - Scout the alleyway for signs of the approaching patrol.
  - Search the satchel for clues about its contents.
  opening_narrative: 'The smell of scorched timber and wet plaster hangs heavy in
    the air, thick enough to taste. You press your back against a crumbling stone
    wall, feeling the grit of pulverized masonry seep through your wool tunic. Somewhere
    nearby, a church bell lies half-buried in the rubble of the village square, its
    bronze surface scarred by shrapnel. A field kitchen sits abandoned just twenty
    yards ahead, its stove still radiating a faint, dying warmth that mocks the sudden
    chill of the afternoon. The smoke haze from the recent shelling turns the sunlight
    into a bruised, sickly orange, obscuring the road ahead.


    ''Miller! Keep your eyes on those tree lines!'' Sergeant David Stone''s voice
    is a low, jagged rasp. He is crouched behind a fallen beam, his rifle leveled
    toward the northern ridge. Beside him, Corporal Jeffrey Clark is frantically tearing
    open a bandage wrapper, his hands trembling slightly despite his training. Between
    them lies the private, gasping for breath, his face pale beneath a layer of soot.
    The soldier isn''t just wounded; he is clutching a thick, leather-bound satchel
    to his chest with a grip that borders on the suicidal.


    ''We can''t stay here, Sergeant,'' Clark hisses, his eyes darting toward the smoke.
    ''If we don''t move him now, we''re sitting ducks for the next mortar barrage.
    We need to get him to the rally point before dark.''


    Stone doesn''t look at him. He keeps his gaze fixed on the shifting shadows of
    the village outskirts. ''We move when I say we move, Clark. If we drag him out
    in the open now, we''re leading every Jerry in this district straight to our position.
    We stay low, we stay quiet, and we wait for the signal.''


    ''The signal isn''t coming!'' Clark snaps, his voice cracking. ''The radio''s
    dead, and the squad is scattered. It''s just us and the wounded. If we stay, we
    die here.''


    You watch them, your fingers tracing the cold metal of your compass in your pocket.
    You can hear it—the distant, rhythmic thud of boots on broken stone coming from
    the street you just vacated. They aren''t far. The enemy isn''t just searching;
    they are sweeping. You spot a movement in the periphery of your vision: a shadow
    slipping between two half-collapsed buildings toward your flank. The private lets
    out a wet, rattling cough, and for a second, the entire village seems to hold
    its breath. The satchel he holds looks heavy, an anchor that might drag all three
    of you into an early grave. You have to decide: do you push for immediate evacuation
    through the narrow alleys, or do you find cover and risk being pinned down by
    the approaching patrol?'
  outcome_summary: The squad is pinned in a ruined village with a wounded soldier
    and critical intelligence.
