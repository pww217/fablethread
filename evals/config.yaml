# Eval harness configuration. Loaded by ccya.eval.config.load_eval_config().

default_pack: eval-pack
default_scenario: baseline
pack_dirs:
  - evals/packs
  - packs/default
  - packs/custom
default_save_root: ~/.cache/ccya-eval
runs_dir: evals/runs
num_turns: 13

logging:
  level: DEBUG

inference:
  temperature_override: null
  cache: false

judges:
  enabled: true
  trace:
    dedup_immutable_sections: true
    state_as_diff: true

  specs:
    - id: state_correctness
      rubric_path: evals/rubrics/state_correctness.md
      model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
      temperature: 0.3
      max_tokens: 32000

    - id: narrative_interplay
      rubric_path: evals/rubrics/narrative_interplay.md
      model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
      temperature: 0.3
      max_tokens: 32000

    - id: prompt_pipeline
      rubric_path: evals/rubrics/prompt_pipeline.md
      model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
      temperature: 0.3
      max_tokens: 48000
      timeout_s: 1800

    - id: meta
      rubric_path: evals/rubrics/meta.md
      model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit
      temperature: 0.2
      max_tokens: 8000

report:
  token_warn_pct: 10
  token_fail_pct: 25
  flag_at_top:
    - tokens_regression
    - extraction_retries
    - extraction_failures
    - judge_score_drop
    - rejected_deltas
    - judge_output_suspicious
    - score_regression
