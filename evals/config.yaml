# Eval harness configuration. Loaded by ccya.eval.config.load_eval_config().
# Anything that varies per machine, per developer, or per experiment goes here —
# NOT in ccya/config.yaml (that file is for the game itself).

default_pack: eval-pack
default_save_root: ~/.cache/ccya-eval   # per-run subdir created under this
runs_dir: evals/runs                 # where REPORT.md and trace files land
num_turns: 10                        # run only first N turns (default/max 10, override with --turns)

inference:
  # null = use prod temps from the engine config (game's config.yaml).
  # Set to 0 (or any float) to override every LLM call uniformly. Useful for
  # `make eval-fast` which runs at temp=0 for deterministic structural diffs.
  temperature_override: null

  # v1: caching is disabled. Cascade invalidation in chained scenarios defeats
  # the speedup for prompt iteration. Re-enable in v2 if needed.
  cache: false

judge:
  enabled: true
  # null = use the engine's model (config.yaml -> llm.model).
  model: null
  rubric_path: evals/rubrics/default.md
  temperature: 0.3
  # Truncate the trace passed to the judge if it exceeds this many characters.
  # Set high to let the judge see the full trace; the model's context window
  # is the real constraint. For 10-turn scenarios this avoids cutting the middle.
  max_input_chars: 100000

report:
  # Per-stream tokens_in growth vs evals/runs/latest:
  token_warn_pct: 10           # >= 10% → ⚠️ warn
  token_fail_pct: 25           # >= 25% → flagged at top of REPORT.md

  # Items always surfaced in the "⚠️ Flagged" section at top of REPORT.md.
  flag_at_top:
    - tokens_regression
    - extraction_retries
    - extraction_failures
    - judge_score_drop
    - rejected_deltas
