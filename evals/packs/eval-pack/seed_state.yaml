meta:
  game_name: eval
  turn: 0
  setting_pack: eval-pack
  model: ""

pc:
  name: Aren Voss
  tagline: Reluctant courier on the merchant road
  bio: |
    Mid-thirties, broad shoulders, careful with words. Took on a courier contract
    to clear an old debt. Just arrived in Marrow's Crossing with a heavy pack and
    a heavier obligation.
  stats:
    strength: 3
    dexterity: 3
    wits: 2
    lore: 2
    charisma: 3
    resolve: 3
  conditions: []
  momentum: 0

location:
  id: marrows_crossing
  name: Marrow's Crossing
  description: |
    A market town built around the confluence of two rivers. Cobblestone streets,
    timber-framed buildings, and the constant sound of water from the mills. The
    town square has a stone well and a statue of the founder. Most shops are closing
    for the evening.

inventory:
  - id: credits
    name: Credits
    amount: 500
    notes: Common coin, accepted at any inn or stall on the merchant road.
  - id: iron_dagger
    name: Iron dagger
    amount: 1
    notes: Plain crossguard, edge worn from honing. Belt-carried.
  - id: bandages
    name: Linen bandages
    amount: 3
    notes: Three rolls. Field-grade — won't replace a healer.
  - id: traveler_cloak
    name: Traveler's cloak
    amount: 1
    notes: Oiled wool, road-stained, hood deep enough to hide a face.
    aliases:
      - cloak
      - travel cloak
  - id: brass_key
    name: Brass key
    amount: 1
    notes: A small brass key Halden gave you with the ledger.

quests:
  - id: settle_the_debt
    title: Settle the Old Debt
    status: active
    objectives:
      - description: Find Caron, the man you owe.
        done: false
      - description: Pay Caron in person and have him mark the debt cleared.
        done: false
  - id: deliver_the_ledger
    title: Deliver Halden's Ledger
    status: active
    objectives:
      - description: Accept the courier contract from Halden.
        done: false
      - description: Carry the ledger to the merchant Halden at the Crossed Keys Inn.
        done: false
      - description: Confirm the contract with Halden in person.
        done: false
  - id: clear_the_road_toughs
    title: Clear the Road Toughs
    status: active
    objectives:
      - description: Find out who hired the toughs blocking the road.
        done: false
      - description: Convince, pay, or remove the toughs from the inn.
        done: false

scene:
  tagline: Market town at dusk
  tags:
    - peaceful
    - start
  present_npcs:
    - id: caron
      name: Caron
      title: Old creditor
      notes: Sits at a corner table in the tavern, nursing a drink and watching the door.
      bio: A portly man in his sixties with a merchant's ledger and a patient demeanor. You owe him 500 credits from a failed venture three years ago.
    - id: halden
      name: Halden
      title: Merchant
      notes: Stands near the town well, examining a map and a pressed wax seal.
      bio: A road merchant in his fifties who hires couriers when his usual runners are spoken for. Honest by reputation, careful with money.
    - id: innkeeper
      name: Edda
      title: Innkeeper at the Crossed Keys
      notes: Wiping down the bar at the Crossed Keys, which is two streets over.
      bio: Runs the inn alone since her husband died. Knows every traveler by face if not by name. Stays out of trouble unless it walks through her door.
  world_state:
    - Marrow's Crossing is a market town at the confluence of two rivers, known for its mills and the annual river festival.
    - Iron coin (credits) is the universal currency on the merchant road; barter is acceptable but slower.
    - The road has been quieter than usual this season — fewer caravans, more independent runners, more opportunists.
  recent_events:
    - You arrived in Marrow's Crossing after three days on the road.
    - You heard rumors of road-toughs extorting travelers near the Crossed Keys Inn.
    - You found Caron in the tavern — he's been waiting for you.

arc:
  visible_goal: Clear your debts and deliver the ledger — two obligations binding you to Marrow's Crossing.
  thematic_question: What does it cost to settle old debts when new ones keep forming?
  phase: setup
  hidden_truths:
    - Matthew Estrada is not a traveler — he's a courier for a rival merchant house, and the toughs were hired to intercept his competition.
    - The brass key Halden gave you opens a back room at the inn where intercepted couriers' messages are stored.
    - Caron's debt was not a failed venture — it was a deliberate investment in your skills, and he's been waiting for you to prove yourself.
  discovered_truths: []
  active_threads:
    - id: settle_the_debt
      summary: Settle the 500-credit debt with Caron.
      tags: [debt, caron, obligation]
      state: latent
      urgency: normal
      progress: 0
      last_offered_turn: 0
    - id: deliver_the_ledger
      summary: Deliver Halden's ledger to the merchant at the Crossed Keys Inn.
      tags: [courier, halden, contract]
      state: latent
      urgency: normal
      progress: 0
      last_offered_turn: 0
    - id: clear_the_road_toughs
      summary: Deal with the toughs blocking the inn entrance.
      tags: [toughs, road, confrontation]
      state: latent
      urgency: low
      progress: 0
      last_offered_turn: 0
  latent_threads: []
  completed_threads: []
  arc_engagement: 0
  pc_drive: Prove you can handle the road — clear your name and earn enough to start over.

compendium:
  npcs:
    caron:
      name: Caron
