  established_facts:
    # === Universe (Expanse canon) ===
    - It is the year 2351 in the Expanse universe. Humanity has colonized Earth, Mars, and the Belt. The protomolecule and Eros are not yet known to the public.
    - Earth is governed by the United Nations (UN). Mars is governed by the Martian Congressional Republic (MCRN). The Belt is loosely organized under the Outer Planets Alliance (OPA), which is fragmented into competing factions.
    - Belter creole glossary — inyalowda=Inners (Earthers/Martians), beltalowda=us Belters, sa sa ke=you understand, oye=hey, kowmang=comrade or the short Belter knife, pelo=junker ship.
    - Belters are tall and thin from low-gravity development. They consider station and ship life their natural home. Earth and Mars consider Belters second-class citizens.
    - Water, air, and reaction mass are the three currencies that matter most in the Belt. Inner-system corporations tightly control all three.
    - The Epstein Drive is the standard ship propulsion. Sustained burns at 0.3-1.0 g are common; brachistochrone trips between major bodies still take days to weeks.
    - Standard space combat uses PDCs (point-defense cannons), railguns, and torpedoes. Standard EVA suits are vac-rated with mag boots.

    # === Setting (where the player is) ===
    - You are on Ceres Station, a hollowed-out asteroid spun for one-third gravity, home to roughly three million Belters. Ceres is technically administered for the UN by Star Helix Security; in practice the OPA runs the lower levels.
    - You are specifically on the Lower Levels Market — a two-kilometer concourse of taverns, food stalls, fences, fixers, and job-boards. Star Helix tolerates small smuggling here; they crack down on weapons, narcotics, and political contraband.
    - Your ship, the *Wretch*, is docked in cradle 41-B, three levels above the market via freight lifts.

    # === Ship: The Wretch ===
    - The *Wretch* is a forty-year-old Mowteng-class light freighter. Hull patched in three places. Port maneuvering thruster lags by ~200 ms. Water recycler is failing. Cargo capacity is modest (six standard crates).
    - The *Wretch* is functional but only barely. Any major job requires repairs first. She cannot survive a real chase from a modern MCRN or UN ship.

    # === Crew ===
    - Davi Moreau-Ng — your pilot. Half-Earther, half-Martian, ex-MCRN deserter (two years out). Cynical, brilliant under burn, has classified MCRN patrol corridor maps. Currently asleep in the *Wretch's* galley.
    - Sigge Petrescu — your first mate and enforcer. Pallas-born Belter, ex-bouncer, scarred jaw, soft-spoken, fiercely loyal. Currently watching the *Wretch's* cargo ramp, armed.

    # === Immediate situation ===
    - You owe 4,200 credits in Ceres dock fees. You have 1,800 credits. The harbormaster's clock reads ~20 hours. If you don't pay, the *Wretch* is seized and auctioned for parts.
    - Your last run was a milk-run from Tycho Station to Ceres — six crates of black-market water filtration cores. It paid the bills, nothing more.
    - Common cargo for ships like the Wretch includes water filtration cores, contraband nutrients, MCRN small arms, prohibited tech, OPA documents, and occasionally refugees.
