location:
  id: ceres-lower-market
  name: Ceres Station — Lower Levels Market
  description: |
    A spun cavern of corridors and concourses, one-third gravity, two-kilometer
    arc of stalls and bays. Strung lights — half flickering. The air carries
    fryer oil, ozone, recycled sweat, and stim-tea. Star Helix patrols loiter at
    the far end of the concourse. Tavern doorways spill warm light. Job-board
    terminals glow in shadowed alcoves. The Wretch sits in cradle 41-B, three
    levels above through the freight lifts.

