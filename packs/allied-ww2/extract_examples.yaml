examples:
  - title: "Supply run — inventory change and quest objective"
    thinking: |
      - Ammo clips used (-2) for the supply run.
      - Escort convoy reached KM 12 milestone.
      - Dust and diesel on the air; convoy trucks idling.
    json: |-
      {"state_delta": {"inventory_remove": [{"id": "ammo-clips", "amount": 2}], "quest_updates": [{"id": "escort-convoys", "objectives": [{"index": 1, "done": true}]}]}, "actions": ["Ride with the convoy to KM 12", "Scout the river crossings ahead", "Check ammo stock at the supply depot", "Press forward toward the Ardennes"]}

  - title: "Radioman — establish facts about enemy movement"
    thinking: |
      - No inventory or quest changes this turn.
      - New intel: Panzer unit spotted, enemy buildup near Ardennes.
      - Radio shack hums with intercepted transmissions.
    json: |-
      {"state_delta": {"established_facts_add": ["German Panzer unit spotted moving toward River Crossings overnight.", "Allied radio intercept suggests enemy buildup near the Ardennes corridor."]}, "actions": ["Relay coordinates to artillery command", "Push the message past standing orders", "Send a runner to HQ with the intercept", "Monitor enemy frequencies for more signals"]}

  - title: "Medic — condition change and NPC interaction"
    thinking: |
      - Morphine used (-1) to treat the wounded.
      - Hospital at capacity; triage decisions needed.
      - Field tent smells of antiseptic and sweat.
    json: |-
      {"state_delta": {"inventory_remove": [{"id": "morphine", "amount": 1}], "established_facts_add": ["Sgt. O'Brien took a shrapnel wound to the leg during the outpost sweep.", "Field hospital is at maximum capacity; triage decisions are being made."], "present_npcs": [{"id": "sgt-obrien", "name": "Sgt. O'Brien", "title": "Infantryman", "notes": "Grimacing through the morphine; asking for a field surgeon.", "bio": "Veteran of the North African campaign; leg wound from shrapnel during recent patrol."}]}, "actions": ["Treat O'Brien before the shrapnel spreads", "Triage the next wounded soldier", "Search for more morphine in the supply tent", "Send a runner for the field surgeon"]}

  - title: "Driver — inventory shift and quest failure"
    thinking: |
      - Fuel cans depleted (-3) during the delivery run.
      - Dispatch delivery failed — didn't reach Forward Command in time.
      - Truck engine idles rough; fuel gauge on empty.
    json: |-
      {"state_delta": {"inventory_remove": [{"id": "fuel-cans", "amount": 3}], "quest_updates": [{"id": "deliver-messages", "status": "failed", "objectives": [{"index": 1, "done": true}]}]}, "actions": ["Drive hard to Forward Command before dark", "Scout an alternate route around the ambush", "Refuel from the reserve cans in the truck bed", "Abandon the dispatch and fall back"]}

  - title: "Minimal — dialogue only, no state change"
    thinking: |
      - Pure dialogue; no state changes this turn.
      - Mess hall is quiet; soldiers are cleaning weapons.
    json: |-
      {"state_delta": {"scene_tags": ["dialogue"], "scene_tagline": "Quiet in the mess", "location_description": "The mess hall is dimly lit. A few soldiers clean their rifles at far tables.", "present_npcs": [{"id": "cook-henry", "name": "Cook Henry", "title": "Mess cook", "notes": "Gruff but fair; knows everyone's name."}]}, "actions": ["Ask Henry about the troops' morale", "Check the supply crates in the corner", "Head back to the front line", "Write a letter home"]}
