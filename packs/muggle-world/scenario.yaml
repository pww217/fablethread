constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [10, 14]
  prose_word_range: [200, 450]
  # composition
  required_inventory_kinds: [tool, consumable]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "suddenly a letter arrived"
    - "a mysterious stranger appeared"
    - "the magical world came calling"
    - "they discovered they were special"
    - "a hidden door revealed a secret passage"
    - "the wand chose them"
    - "magic surged through their veins"
    - "they were the most powerful witch/wizard of their generation"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is someone living in the Muggle world who has some relationship to magic —
    a wizard who left, a squib who never fit in, a Muggle-born who lost their connection,
    or a Muggle who knows too much. They are not a hero. They are not chosen. They are
    a person trying to get through the week, and magic is either the problem or the
    secret they keep. Give them a specific skill that helps them survive in the Muggle
    world and a specific vulnerability that magic used to solve but now can't.

  opening_situation: |
    Start the player in a moment of ordinary Muggle life that is subtly disrupted by
    something magical — not a dramatic intrusion, but a small wrongness. A neighbor's
    cat that blinks too many times. A shop window that shows a reflection that isn't
    there. A phone call from someone who shouldn't have their number. The situation
    should feel like a crack in the wall the player has built around their secret life.
    The stakes should be personal and immediate, not world-saving.

  npcs: |
    NPCs are people the PC encounters in the Muggle world who have some connection to
    magic — a former classmate working as a barista, a Muggle neighbor who noticed
    something they shouldn't have, a squib running a shop that sells things no one
    understands, an Obliviator who shows up unannounced. Each NPC should have a reason
    for being in the PC's life and something they want that conflicts with the PC's
    goal of staying under the radar.

  inventory: |
    Items reflect a person living in the Muggle world with a magical past or secret:
    a Muggle phone that somehow still works, a wand hidden in something ordinary, a
    pouch of Galleons exchanged for crumpled pounds, a potion ingredient disguised as
    a spice, a Muggle ID that barely passes inspection. Include one thing that belongs
    to someone else and that the PC is carrying for reasons they can't explain.

  quests: |
    The starting quest should be about maintaining the status quo — something that
    threatens the PC's carefully constructed normal life. A neighbor who saw something.
    A bill that can't be paid. A person from the magical world who won't leave them
    alone. The objectives should involve navigating Muggle systems (banks, employers,
    landlords, government offices) while managing a magical complication. The tension
    comes from the gap between what the PC used to be able to do with magic and what
    they have to do now with paperwork and social navigation.
