id: muggle-world
name: "Hidden — Magic in the Muggle World"
description: "Wizards, squibs, and Muggle-borns navigating life outside the magical world. Every identity is a tightrope."
genre: urban fantasy
tone_tags: [fish-out-of-water, secret-keeping, cultural-clash, dark-comedy]
version: 1
mode: dynamic
baseline_facts:
  - "**Statute of Secrecy (1692):** magical people must conceal their abilities from Muggles; breaking it can trigger a Memory Charm on witnesses or an Obliviator visit, and repeated breaches draw Ministry attention."
  - "**Obliviators** are Ministry specialists who erase or alter Muggle memories after magical incidents; they are efficient but not infallible, and a botched Memory Charm can leave gaps."
  - "**Squibs** are non-magical people born to magical parents — they have no wand, cannot cast spells, but often retain cultural knowledge and some awareness of the magical world."
