examples:
  - title: "Squib — exchanging magical currency and gaining a contact"
    thinking: |
      - Exchanged 5 Galleons for £200 cash through a discreet contact.
      - New established fact about the exchange rate and the contact's location.
      - The crumpled pound notes smell faintly of ozone.
    json: |-
      {"state_delta": {"inventory_add": [{"id": "crumpled-pounds", "name": "Crumpled pound notes", "notes": "£200 in various denominations. Smells faintly of ozone.", "amount": 5}], "inventory_remove": [{"id": "galleons", "amount": 5}], "established_facts_add": ["The exchange rate is roughly £40 per Galleon when done discreetly.", "A contact named 'Mags' runs a coin shop in Camden that handles magical currency exchanges."], "present_npcs": [{"id": "mags-coins", "name": "Mags", "title": "Coin shop owner, Camden", "notes": "Willing to exchange currency but charges a steep rate. Remembers everything.", "bio": "A squib who ran a successful currency exchange in Diagon Alley before the Ministry cracked down. Now operates a coin shop in Camden as cover."}]}, "actions": ["Ask Mags if anyone has been asking about magical people in the area", "Visit the coin shop again next week to restock cash", "Ask Mags about the person who was in the shop yesterday", "Leave Camden and head to the apartment"]}

  - title: "Wizard — accidental magic exposure and Obliviator risk"
    thinking: |
      - Condition added: noticed (someone saw magic being used).
      - New quest created: cover the exposure before an Obliviator arrives.
      - Objective completed: convinced the neighbor it was a gas leak.
      - The kettle on the stove is still warm from the accidental spell.
    json: |-
      {"state_delta": {"conditions_add": ["noticed"], "quests_add": [{"id": "cover-exposure", "title": "Cover the Exposure", "status": "active", "objectives": [{"description": "Convince the neighbor it was a gas leak.", "done": true}, {"description": "Leave a small gift or apology to ensure silence.", "done": false}, {"description": "Check if anyone else on the street saw anything.", "done": false}]}], "established_facts_add": ["The neighbor saw a light flash from the kitchen window at 7:15 PM.", "The building has no gas line — the gas leak story is fragile."]}, "actions": ["Buy a box of expensive chocolates as an apology gift", "Walk the building and ask other tenants if they saw anything", "Practice a more reliable concealment charm", "Consider moving to a new place"]}

  - title: "Muggle-born — reconnecting with a magical object"
    thinking: |
      - Found a hidden wand in the back of a drawer.
      - Condition removed: wandless (found their old wand).
      - New fact: the wand is still responsive after years of disuse.
      - The wand feels warm, like a hand that hasn't been held in years.
    json: |-
      {"state_delta": {"inventory_add": [{"id": "old-wand", "name": "Holly wand, 11 inches", "notes": "Found in a drawer. Still responsive after years of disuse. Core is phoenix feather.", "amount": 1}], "conditions_remove": ["wandless"], "established_facts_add": ["The wand was hidden in a hollowed-out copy of 'The Rise and Fall of Muggle Inventions' in the bookshelf.", "Phoenix feather cores are rare and tend to be loyal to their original owner."]}, "actions": ["Test a simple spell in private", "Research whether the Ministry tracks wand usage outside magical areas", "Visit the contact who knows about the underground wand market", "Keep the wand hidden and continue living normally"]}

  - title: "Minimal — Muggle conversation, no magical content"
    thinking: |
      - Pure dialogue with a Muggle coworker. No state changes.
      - The breakroom coffee is terrible, as usual.
    json: |-
      {"state_delta": {"scene_tags": ["dialogue"], "scene_tagline": "Breakroom coffee", "location_description": "The office breakroom is fluorescent-lit and smells of burnt coffee. A poster about fire safety peels at the corner.", "present_npcs": [{"id": "dave-coworker", "name": "Dave", "title": "Coworker, accounts department", "notes": "Friendly but nosy. Always asking personal questions.", "bio": "Mid-40s, divorced, knows everyone's business. Asks about the PC's evenings with genuine curiosity."}]}, "actions": ["Give a vague answer and change the subject", "Ask Dave about the office party next week", "Head back to your desk before he asks more questions", "Offer to cover his shift on Friday"]}

  - title: "Quest failure — a secret almost exposed"
    thinking: |
      - Quest failed: could not prevent the neighbor from calling the gas company.
      - Condition added: under-investigation (someone filed a report).
      - New fact: the gas company is sending an inspector.
      - The phone on the counter is still ringing from the neighbor's call.
    json: |-
      {"state_delta": {"quests_add": [{"id": "gas-inspector", "title": "The Gas Inspector", "status": "active", "objectives": [{"description": "Prepare the apartment to look like a normal gas leak.", "done": false}, {"description": "Have an alibi ready for the time of the incident.", "done": false}]}], "quest_updates": [{"id": "cover-exposure", "status": "failed", "objectives": [{"index": 0, "done": true}]}], "conditions_add": ["under-investigation"], "established_facts_add": ["The neighbor called the gas company at 8:30 PM reporting a strange smell and a flash of light.", "The gas company is sending an inspector on Tuesday morning at 9 AM."]}, "actions": ["Set up a plausible alibi for Tuesday morning", "Prepare the apartment to look normal", "Find a way to intercept or distract the inspector", "Consider using a Memory Charm as a last resort"]}
