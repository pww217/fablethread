constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 7]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [9, 12]
  prose_word_range: [275, 550]
  # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "pirate captain with a bounty on their head"
    - "smuggler carrying contraband they don't know about"
    - "the ship is the only thing they have left"
    - "ex-Coalition pilot who went rogue"
    - "the last Browncoat holding a candle for the cause"
    - "a mysterious stranger offering a job in a saloon"
    - "the only pilot who can make the run"
    - "former Companion turned vigilante"
    - "secret Browncoat war hero in hiding"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a specific person living and working on the Rim. They could be a frontier
    deputy in a one-horse mining town, a freight pilot running mail and grain between
    moons, a herd-doctor who treats both cattle and people, a junker dismantling
    crashed Coalition hardware for parts, a saloon owner who hears every rumor that
    crosses the dust line, a terraforming engineer keeping a stalled atmosphere
    project alive, a Companion-guild registrant who has chosen this circuit, a
    Browncoat veteran who put down the rifle and picked up a plough. What shaped
    them is what shaped the Rim — the war, the stalled terraforming, the long supply
    lanes, the Coalition presence that comes and goes. Avoid the iconic captain-with-
    a-ship trope unless the inspiration explicitly asks for it; the Rim is bigger
    than its smugglers.

  opening_situation: |
    Drop the player into a moment grounded in the Rim's reality — a town meeting
    where a company sheriff has just claimed jurisdiction, a freighter dock where
    the pulse-fold catalysts have gone missing, a homestead where a Coalition tax
    assessor has finally arrived three years late, a saloon where a wanted Browncoat
    has just walked in, a herd-doctor's cabin where someone has been brought in with
    a wound that is going to attract attention. The opening should feel like a small
    specific place — wood porches, dust on boots, a steam kettle next to a
    holographic ledger — where a single decision will set off consequences that
    cannot be taken back.

  npcs: |
    Each NPC is a person carrying their own version of the Rim's tensions. The town
    sheriff knows which of their deputies still wears a brown coat under the uniform.
    The freight pilot owes money to a Coalition customs officer they cheated. The
    rancher remembers which neighbours informed during the war. The Companion-guild
    registrant has a client list that includes both sides. At least one NPC should
    have interests that conflict with the player's — a Coalition loyalist among
    independents, a company foreman among free settlers, a sibling who took the
    other side. Names should feel period-real and culturally varied (Hannah Bowen,
    Cyrus Quill, Mei-Ling Park, Esteban Vega, Anders Holm, Yuki Walsh) — never
    space-opera stylized.

  inventory: |
    Items reflect both the frontier and the war that just ended. A deputy carries a
    plasma sidearm with a hand-cranked recharger and a paper warrant book. A pilot
    carries fuel certificates (forged or real), a wrench worn smooth, and a battered
    nav-slate with hand-annotated jump corridors. A rancher carries a lever-action
    rifle, a set of medical clamps, and a Coalition-issued identity card they refuse
    to use. A junker carries a plasma cutter, a pry-bar, and a salvaged data chip
    they haven't read yet. Show the mismatch: high tech beside hand tools, plasma
    beside black-powder, neural-link patches beside paper ledgers.

  quests: |
    The starting quest should be local and material — something that affects this
    town, this freight route, this homestead, this herd. The objectives should force
    the player into the Rim's politics: a Coalition warrant being served on a
    neighbour, a debt owed to a company sheriff, a buried weapons cache from the
    war that someone has just found, a shipment of medicine that won't pass customs,
    a stalled terraforming relay that the inner worlds want shut down. There should
    be at least one objective that creates tension with another NPC or faction. The
    quest should cost something — fuel, trust, a friendship that survived the war
    until now, a name that will end up on a list.
