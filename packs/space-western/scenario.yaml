constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 7]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [9, 12]
  prose_word_range: [200, 450]
  # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "pirate captain with a bounty on their head"
    - "smuggler carrying contraband they don't know about"
    - "the ship is the only thing they have left"
    - "ex-corporate pilot who went rogue"
    - "the last surviving crew of a destroyed ship"
    - "a mysterious stranger offering a job"
    - "the only pilot who can make the run"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a specific person living in the Rim's frontier systems. They could be a
    freight pilot who knows every jump corridor between the outer moons, a station
    mechanic who keeps three habitat rings pressurized, a militia scout who patrols the
    drift lanes, a data-broker running information between the generation ships, a
    salvage diver pulling usable parts from derelict hulls, a council liaison negotiating
    tolls and trade agreements. What shaped them is the Rim's pressure: isolation,
    scarcity, the constant negotiation between survival and community. Avoid the lone
    wolf; the Rim is held together by people who need each other. Give them a specific
    role, a specific tie to a community, and something they're responsible for.

  opening_situation: |
    Drop the player into a moment that the Rim's reality has created — something that
    requires a decision in a place where there is no outside help. The situation should
    feel like inheriting a problem that only they can solve: a freighter that needs a
    decision before the air runs out, a station council that needs an answer by the next
    cycle, a patrol route that reveals something that changes the local balance. The
    opening should feel grounded in the spatial reality: a corridor, a dock bay, a
    hydroponic bay, a spin-gravity observation deck, a flooded section of a generation
    ship. Something that requires a choice right now.

  npcs: |
    Each NPC is a person with a stake in the Rim's survival, a specific relationship to
    the player, and something they're not saying. At least one should have interests
    that conflict with the player's — not as a villain, but as someone whose community
    depends on different choices. The station councilor speaks with the weight of
    responsibility. The pilot speaks with the casual competence of someone who has
    survived bad jumps. The mechanic speaks with the practical wisdom of someone who
    has kept things running through impossible cycles. Everyone has a community behind
    them; everyone is calculating what they can afford.

  inventory: |
    Items reflect the PC's role in the Rim's economy. A pilot carries navigation tools,
    emergency supplies, and something from a ship that doesn't exist anymore. A mechanic
    carries tools, replacement parts, and a reference manual that nobody else understands.
    A scout carries weapons, comms gear, and a map that is more accurate than any
    corporate record. Show what the character uses daily — the specific tools, the
    specific numbers. Every item should say something about who this person is and what
    they've survived.

  quests: |
    The starting quest should have stakes that are local and material — something that
    affects a station, a habitat ring, a freight corridor, a generation ship. The
    objectives should force the player into the Rim's political reality: negotiations
    with the council, a run through contested space, a salvage operation with competing
    claims, a militia patrol that uncovers something unexpected. There should be at
    least one objective that creates tension with another NPC or faction. The quest
    should feel like it has a cost — in fuel, in time, in trust, in what the player
    is willing to do for the community they're part of.
