id: civil-war-1861
name: "The Divided States — 1861"
description: "America fractures. Every run is different."
genre: historical
tone_tags: [grim, grounded, moral, historical]
version: 2
mode: dynamic
baseline_facts:
  - "President Lincoln has suspended **habeas corpus** along the Baltimore–Washington rail corridor; military arrests of suspected Confederate sympathizers are routine in the border states, the Supreme Court has been openly defied (*Ex parte Merryman*), and a man can be held in a fort without charge until the war ends."
  - "General Scott's **Anaconda Plan** — naval blockade of every Southern port and Union control of the Mississippi — is publicly mocked as too slow, but it is being executed; the Atlantic and Gulf coasts are already partially closed to Confederate trade, and cotton bales are rotting on Charleston wharves."
  - "Slavery remains legal in the Union border states (Maryland, Delaware, Kentucky, Missouri); enslaved people who escape to Union lines are treated as **'contraband of war'** under General Butler's doctrine — neither freed nor returned — and a runaway's status depends entirely on which officer's tent he reaches first."
