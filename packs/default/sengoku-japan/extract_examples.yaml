examples:
  - title: "Castle siege — combat and NPC introduction"
    thinking: |
      - Arrow loosed during castle defense.
      - Enemy ladders being raised on the north wall.
      - Smoke and shouting on the battlements; enemy ashigaru climbing.
    json: |-
      {"state_delta": {"scene_tags": ["combat", "siege"], "scene_tagline": "Castle under attack", "location_description": "The north wall is under assault. Enemy ashigaru are raising ladders while archers keep heads down. Smoke from burning supply stores drifts across the battlements.", "present_npcs": [{"id": "captain-gen'emon", "name": "Captain Gen'emon", "title": "Castle commander", "notes": "Ordering defenders to the north wall; voice hoarse from shouting. Needs reinforcements.", "bio": "Veteran of five castle defenses; knows the enemy tactics but is short on men."}]}, "actions": ["Lead a sortie through the gate to disrupt the ladders", "Reinforce the north wall with available soldiers", "Send a runner to request aid from the ally camp", "Drop rocks and boiling water on the climbers"]}

  - title: "Night raid — inventory change and quest progression"
    thinking: |
      - Torch used to ignite enemy supply cache.
      - Supply raid objective completed.
      - Enemy camp in flames; soldiers screaming.
    json: |-
      {"state_delta": {"inventory_remove": [{"id": "torch", "amount": 1}], "quest_updates": [{"id": "sabotage-supplies", "objectives": [{"index": 1, "done": true}]}], "recent_events_add": ["Enemy supply cache destroyed by fire. The garrison will struggle to feed through the night.", "Alarms are raised; enemy soldiers are forming up for pursuit."]}, "actions": ["Retreat through the tree line to avoid pursuit", "Split the party — some create a diversion while others escape", "Press the advantage and attack the enemy camp gates", "Find the prisoner you were sent to extract"]}

  - title: "Battlefield — condition change and NPC interaction"
    thinking: |
      - PC wounded by arrow — condition added.
      - Field medic treating wounds with limited supplies.
      - Battlefield is chaotic; wounded and dying everywhere.
    json: |-
      {"state_delta": {"pc_condition_add": ["arrow wound — lower left thigh, bleeding heavily", "shock — hands shaking, vision blurring"], "recent_events_add": ["The ashigaru formation has broken; soldiers are fleeing the field.", "A field medic is treating the wounded near a burned-out cart."], "present_npcs": [{"id": "nun-shizuka", "name": "Nun Shizuka", "title": "Temple medic", "notes": "Binding wounds with torn cloth; calm under pressure. Has treated hundreds of casualties.", "bio": "A nun who tends the wounded on both sides; believes suffering has no allegiance."}]}, "actions": ["Let Shizuka treat the wound", "Try to stand and rejoin your unit", "Ask Shizuka about the battle's outcome", "Drag a fallen comrade to cover"]}

  - title: "Defection — arc thread and NPC conflict"
    thinking: |
      - New fact: ally lord is negotiating with the enemy.
      - Betrayal brewing — information from a shinobi source.
      - War tent tense; allies exchanging suspicious glances.
    json: |-
      {"state_delta": {"recent_events_add": ["A shinobi report confirms Lord Matsudaira is sending envoys to the enemy camp under cover of darkness.", "Your own lord trusts Matsudaira's alliance — but the report suggests otherwise."], "present_npcs": [{"id": "envoy-kenji", "name": "Envoy Kenji", "title": "Matsudaira's representative", "notes": "Calm and courteous; avoids direct questions. May be delivering terms, not just messages.", "bio": "Serves Lord Matsudaira; known as a skilled negotiator and possible double agent."}]}, "actions": ["Warn your lord about Matsudaira's negotiations", "Investigate Kenji's true purpose", "Prepare your unit for the possibility of an ally's betrayal", "Confront Kenji directly about the envoys"]}

  - title: "Minimal — dialogue only, no state change"
    thinking: |
      - Pure dialogue; no state changes this turn.
      - Campfire watch; soldiers resting between engagements.
    json: |-
      {"state_delta": {"scene_tags": ["dialogue"], "scene_tagline": "Campfire watch", "location_description": "A small fire burns in the camp. Soldiers sit in groups, cleaning weapons and eating rice. Distant drums mark the watch change.", "present_npcs": [{"id": "veteran-taro", "name": "Veteran Taro", "title": "Ashigaru", "notes": "Sharpening his spear; has served three lords. Pragmatic and tired.", "bio": "Fought at Nagashino; lost his unit to arquebus fire. Survived by following orders."}]}, "actions": ["Ask Taro about fighting arquebusiers", "Share rice and rest", "Stand watch and keep your weapon close", "Ask about the next campaign"]}
