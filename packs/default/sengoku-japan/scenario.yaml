npc_bonds:
  - id: sworn_retainer
    tags: [loyalty, service, years_of_service]
    description: The NPC has served the PC's clan for years. The bond is feudal — duty layered over genuine respect, tested by battle and hardship.
  - id: battle_comrade
    tags: [combat, shared_victory, battlefield_trust]
    description: The NPC and PC fought side by side in a battle that defined them both. Each knows how the other moves in combat.
  - id: disgraced_kin
    tags: [family, shame, divided_loyalty]
    description: The NPC is a relative whose dishonor stains the family. The PC must navigate love for kin and the weight of obligation.
  - id: childhood_rival
    tags: [rivalry, youth, competitive_history]
    description: The NPC was raised alongside the PC in the same household or dojo. They competed for everything — and still do.
  - id: former_sensei
    tags: [teacher, mentorship, martial_debt]
    description: The NPC trained the PC in the ways of the warrior. The teacher-student bond carries expectations neither can fully escape.
  - id: wed_by_war
    tags: [marriage, alliance, political_bond]
    description: The NPC is wed into the PC's clan through a political marriage. The arrangement began as strategy but became something more.
  - id: clan_oath
    tags: [blood_oath, brotherhood, unbreakable_bond]
    description: The PC and this NPC swore a clan oath together before their lord. The oath binds them beyond personal feeling.
  - id: rescued_in_battle
    description: The NPC once pulled the PC from a collapsed siege tower; the debt is unspoken but known.
    tags: [rescue, debt, shared_combat]
    incompatible_with: []

scene_detail_bundles:
  - id: castle_bailey
    items: [a yari spear rack with three spears missing, a scroll half-unrolled on a campaign chest]
    conditions: [the compound muddy from last night's rain, the gate reinforced with iron bands]
    sensory: [the whicker of horses in the stable, the smell of cooking rice from the guardhouse]
  - id: mountain_pass
    items: [a broken cart axle propped against a boulder, a paper lantern crumpled by rain]
    conditions: [the path eroded by the last storm, fog pooling in the valley below]
    sensory: [the whistle of wind through the pass, the distant crash of a rockslide]
  - id: village_gate
    items: [a wooden gate with fresh arrow impacts, a notice board with a new decree nailed over an old one]
    conditions: [the well bucket lowered but not raised, rice drying on woven mats trampled]
    sensory: [a dog barking at the treeline, the murmur of hushed voices from inside the gate]
  - id: temple_grounds
    items: [a bronze bell with a split clapper, a wooden training blade left on a stump]
    conditions: [incense ash scattered across the steps, the garden overgrown and neglected]
    sensory: [the rustle of wind through bamboo, the faint chime of a wind bell]
  - id: war_camp
    items: [a command tent with a map weighted by stones, a messenger's horse tethered and unsaddled]
    conditions: [the cooking fire smoking badly, the camp tense after the last skirmish]
    sensory: [the ring of a smith's hammer on a field anvil, the low murmur of soldiers around a campfire]
  - id: rice_paddy
    items: [a wooden hoe left in the furrow, a scarecrow with a broken pole]
    conditions: [the water murky and still, the dikes in need of repair]
    sensory: [the croak of frogs, the drone of mosquitoes at dusk]
  - id: teahouse
    items: [a ceramic cup with a crack through the glaze, a board with a half-played game of go]
    conditions: [the tatami worn thin by years of footsteps, the paper screens patched in several places]
    sensory: [the fragrance of green tea, the murmur of conversation from the next room]
