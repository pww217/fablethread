constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [12, 18]
  prose_word_range: [275, 550]
  # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "the last surviving samurai"
    - "a cursed blade that drinks blood"
    - "a mysterious ronin with a tragic past"
    - "the emperor's secret weapon"
    - "a ninja who can walk on water"
    - "a honor-bound duel to the death"
    - "the cherry blossoms fall on fresh graves"
    - "a warrior who has lost everything and finds redemption"


