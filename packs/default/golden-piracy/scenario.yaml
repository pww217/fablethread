currency_id: doubloons
starting_currency_amount: 25
world_facts:
  - "The seas are controlled by powerful pirate fleets and colonial navies clashing over trade routes and island holdings — and the two empires agree on one thing: people are cargo."
  - "Caribbean island settlements trade in rum, spices, and stolen cargo, with loyalty bought by shares of plunder — and with the lives of those who were cargo before they were crew."
  - "Mutiny is common on every vessel, captain's authority depends on keeping crew fed and motivated — and ironically the Articles hold best when the pressure on them is greatest."

constraints:
   # required-presence
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  prose_word_range: [530, 930]
  # composition
  required_inventory_kinds: [weapon, tool]

world_rules:
  - No supernatural, paranormal, or mythological creatures exist in this setting. Technology is limited to the Age of Sail era (late 1600s–early 1700s).

