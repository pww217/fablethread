npc_bonds:
  - id: foxhole_brother
    tags: [combat, shared_section, front_line]
    description: The NPC was in the same section as the PC during a sustained engagement. They shared a foxhole, shared ammunition, shared what they had.
  - id: training_batch
    tags: [basic_training, unit_cohesion, shared_introduction]
    description: The NPC and PC went through basic training together. The bond of shared misery and transformation never quite fades.
  - id: did_a_medevac_for
    tags: [medical, evacuation, saved_life]
    description: The PC carried or helped carry the NPC to a medic under fire. The NPC owes their life or their limb to that moment.
  - id: deserted_together_once
    tags: [desertion, secret, shared_risk]
    description: The NPC and PC both stepped off the line once, in a moment neither will speak of. The shared secret is a bond neither can afford to break.
  - id: superior_officer_conflict
    tags: [rank, authority, friction]
    description: The NPC is a non-com or officer who has clashed with the PC before. The friction is personal, grounded in a specific incident.
  - id: home_town_connection
    tags: [home, shared_origin, civilian_life]
    description: The NPC is from the PC's home town or region. They knew the same streets, the same bars, the same pre-war life.
  - id: shared_pow_experience
    tags: [captivity, survival, mutual_rescue]
    description: The NPC and PC were held together in a POW camp. They survived it together and the bond is forged in that specific deprivation.
  - id: wounded_before
    description: The NPC was under the PC's care in a previous engagement and carries a visible scar from it.
    tags: [injury, care, shared_history]
    incompatible_with: []

scene_detail_bundles:
  - id: bombed_out_village
    items: [a church bell lying in the rubble, a field kitchen with its stove still warm]
    conditions: [rubble-choked streets, smoke haze from a recent fire]
    sensory: [the echo of boots on broken stone, the creak of a half-collapsed beam]
  - id: command_post
    items: [a map table with unit positions in grease pencil, a field telephone with the wire trailing out the door]
    conditions: [papers strewn across the floor, hastily evacuated]
    sensory: [the drone of distant bombers, the crackle of a radio left on]
  - id: field_hospital
    items: [a triage table with blood-soaked sawdust on the floor, a clipboard of morphine doses signed by different hands]
    conditions: [low on supplies, lantern light flickering]
    sensory: [the hiss of a low-fuel lantern, the moan of wounded men through canvas]
  - id: trench_line
    items: [a periscope rifle propped against the parapet, a signal flare pistol with three rounds left]
    conditions: [mud-choked duckboards, crumbling sandbag parapet]
    sensory: [the thump of distant artillery, the sharp smell of cordite and wet earth]
  - id: supply_depot
    items: [a pallet of ammunition crates with different unit codes, a typewriter on a crate with a half-typed inventory sheet]
    conditions: [crates stacked haphazardly in the rain, fuel drums with slow leaks]
    sensory: [the smell of petrol and damp canvas, the clatter of a loose shutter in the wind]
  - id: destroyed_farmhouse
    items: [a piano with a bullet through its frame, a cellar door half-open]
    conditions: [the roof collapsed in the center, a dead cow in the yard]
    sensory: [the buzz of flies, the smell of burnt hay]
  - id: river_crossing
    items: [a pontoon bridge anchored with ropes, a crate of waterproofed flares]
    conditions: [the current running fast, the fog lying low over the water]
    sensory: [the rush of the river, the creak of ropes under tension]
