constraints:
   # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
   # ranges
  inventory_size_range: [4, 8]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [12, 18]
  prose_word_range: [275, 550]
   # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
   # creativity guards
  forbid_cliches:
     - "last soldier standing"
     - "the war ends after this mission"
     - "super weapon"
     - "you're the only one who can"
     - "the enemy is monstrous / inhuman"
     - "you've seen too much"
     - "the war made you this way"
     - "you're just a soldier / sailor / airman — follow orders"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a rank-and-file Allied service member — not an officer giving orders,
    not a special operative with a dossier. He is a rifleman, a radioman, a
    mechanic, a medic, a driver, a clerk. His rank is real. His training is
    real. His fear is normal, not dramatic. What shaped him is pre-war: a
    farming town, a Detroit assembly line, a Liverpool dock, a Saskatchewan grain
    field, a Wellington pub. Give him a skill that matters in this moment and a
    liability that matters in the next.

  opening_situation: |
    Drop the player into a moment of immediate, visceral action — a firefight that
    started without warning, a retreat through a burning village, a trench being
    overrun, a beachhead under fire, a night ambush in a forest. The situation
    should demand physical response first and thinking second. What the player
    walks into should involve danger, movement, and people who need them right now.
    The stakes are survival and the people beside them. The most interesting
    moments are the ones where instinct and training collide and the player has
    to choose what to do in the next thirty seconds.

  npcs: |
    All soldiers, sailors, airmen, and military police are men. Civilians may
    be women or men, but every uniformed person is male. The initial NPCs in
    the opening scene MUST use male names only — select from the male name
    pool provided. Each NPC is a real person in the Allied structure — or a
    civilian whose interests intersect with it. He has a rank, a specialty,
    a reason for being where he is. He is not an ally because he is a good
    man; he is an ally because the war made them so. At least one NPC should
    have an interest that conflicts with the player's — not as a traitor, but
    as someone with different orders, different information, or different
    priorities.

  inventory: |
    Items reflect what a service member actually carried or had access to. Standard
    issue weapons, personal modifications, captured items (if appropriate to theater),
    letters and photos, ration cards, field manuals, medical supplies. Show the
    gap between what the supply catalogue promised and what the player actually has.
    Include one thing that was important to someone else before it became a tool.

  arcs: |
    Arc seeds should center on survival, loyalty, and the moral weight of war.
    Visible goals: keep your squad alive through the night, reach the extraction
    point, hold a position until the enemy breaks, protect a wounded comrade,
    make it back to your unit after being separated. Thematic questions: what
    does it cost to survive when others don't? When do you follow orders and
    when do you do what's right? Can you stay human in an inhuman situation?
    PC drives: protect your squad, get home, survive the war, make amends for
    something you did, prove yourself to your unit, escape the front. Hidden
    truths: the mission you're fighting for is already over, your commanding
    officer is compromised, the enemy unit you're facing has been decimated and
    is fighting out of desperation. Thread ideas: a squadmate's death that
    changes everything, a civilian caught in crossfire, a prisoner who knows
    something critical, a position that becomes a trap, a retreat that turns
    into a rout.
