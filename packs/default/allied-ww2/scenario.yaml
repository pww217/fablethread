currency_id: dollars
starting_currency_amount: 75
world_facts:
  - The war has been raging for years with no clear end and fronts that shift without warning — and the home front is being told a coherent story about it that the men in the line cannot recognize as their own.
  - Occupied territories resist through underground networks while collaborationist governments maintain order under threat — and the line between resister and collaborator is sometimes a letter, sometimes a single missed meeting.
  - Advanced weapons technology and codebreaking are reshaping combat and intelligence — and most of this is happening far from the line, which means the line is dying of decisions made by people who have never been there.

constraints:
  # required-presence
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  prose_word_range: [530, 930]
  # composition
  required_inventory_kinds: [weapon, tool]

world_rules:
  - No supernatural, paranormal, or sci-fi phenomena exist in this setting. All events are grounded in historical reality (1940–1945).

