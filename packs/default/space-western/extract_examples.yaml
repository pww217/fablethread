      {"state_delta": {"scene_tags": ["negotiation", "habitat"], "scene_tagline": "Fuel spent — the Argyre ring holds pressure", "location_description": "The habitat ring spins with spin gravity. Hydroponic bays line the inner curve; the viewports show Jupiter filling half the sky. A militia frigate is docked at the outer ring.", "present_npcs": [{"id": "commander-voss", "name": "Commander Lira Voss", "title": "Rim Alliance militia — Argyre Station", "notes": "Satisfied the pilot made the fuel run. She's assigning them to the outer patrol corridor.", "bio": "Former freight security contractor who joined the militia. Knows the jump corridors better than anyone. Pragmatic about the corps' reach."}], "inventory_remove": [{"id": "reaction-mass", "amount": 200}], "quest_updates": [{"id": "deliver-the-reactor-parts", "objectives": [{"index": 1, "done": true}]}]}, "actions": ["Take the outer patrol route", "Visit the hydroponic bays", "Talk to the station mechanic", "Dock at the frigate's mess"]}

  - title: "Ship damage + salvage quest + competing claims + NPC death"
