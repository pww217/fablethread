      {"state_delta": {"scene_tags": ["salvage", "tension"], "scene_tagline": "Hull breach — the diver is lost", "location_description": "The derelict hab-module is venting slowly. Flooded corridors on the lower decks. The salvage rig is attached but the hull groans under the strain.", "present_npcs": [{"id": "scavenger-reed", "name": "Scavenger Maeve Reed", "title": "Independent salvage diver", "notes": "Standing at the airlock; calculating whether the module is worth the risk.", "bio": "Former Argo-class crew member who stayed behind when the ship went dark. Knows the interior layout. Has a competing claim on the same module."}], "inventory_remove": [{"id": "hull-sealant", "amount": 1}], "compendium_npc_remove": ["diver-ellis"], "quest_updates": [{"id": "secure-the-salvage-rights", "title": "Secure the salvage rights", "status": "active", "objectives": [{"description": "Claim the derelict module before the Protogen hauler arrives — they have registration papers but the Drifters are already on site.", "done": false}, {"description": "Patch the hull breach enough to bring the salvage rig inside without depressurization.", "done": false}]}]}, "actions": ["Negotiate with Scavenger Reed on the claim", "Board the module before the corps hauler arrives", "Patch the hull and secure the rig", "Signal the Drifters about the corp presence"]}

