pc_situation_schema:
  - key: vessel
    description: What vessel does the PC have? Name, type, condition, and features.
    required: false
    persist: true
  - key: home_port
    description: What port or station does the PC dock or claim as home?
    required: false
    persist: true
  - key: reputation
    description: How is the PC known or unknown? Feared, respected, or just another face?
    required: false
  - key: filiation
    description: What faction or guild is the PC aligned with or registered under?
    required: false
    persist: true

npc_bonds:
  - id: old_crewmate
    tags: [crew, ship, shared_mileage]
    description: The NPC served on the same ship as the PC — not friends, but the kind of bond formed by shared cargo holds and close calls.
  - id: shared_smuggling_run
    tags: [smuggling, trust, mutual_risk]
    description: The NPC and PC ran a smuggling route together. The job paid but the mutual liability is the real tie that holds.
  - id: coalition_adversary
    tags: [coalition, war, enemy_lines]
    description: The NPC was on the opposite side of the war. The PC knows them as an adversary who earned respect through competence.
  - id: settlement_debt
    tags: [settlement, community, obligation]
    description: The NPC's settlement saved the PC once — gave them shelter, fuel, a reason to keep flying. The bond is to the community, not just the person.
  - id: war_remnant
    tags: [war, veteran, shared_trauma]
    description: The NPC served in the same theater of the war as the PC. The war shaped them similarly and neither talks about it.
  - id: family_scattered
    tags: [family, separation, search]
    description: The NPC is connected to the PC's family — a sibling, a cousin, someone who knows what happened to the rest.
  - id: partisan_cell
    tags: [rebellion, underground, mutual_cause]
    description: The NPC and PC worked with the same partisan cell during the war — a shared cause that outlasted the armistice.
  - id: smuggling_connection
    description: The NPC was the PC's contact on a smuggling route that went bad — trust was broken, then rebuilt.
    tags: [smuggling, trust, shared_risk]
    incompatible_with: []

scene_detail_bundles:
  - id: cargo_bay
    items: [a grav pallet with a broken levitator, a hydro-spanner with an adaptive grip]
    conditions: [the bay depressurized and cold, cargo netting loose and tangled]
    sensory: [the hum of emergency lighting, the hiss of atmosphere cycling through scrubbers]
  - id: town_street
    items: [a holo-sign flickering between two advertisements, a freight droid powered down against a wall]
    conditions: [the street half in shadow, market stalls abandoned mid-day]
    sensory: [the buzz of faulty lighting, the distant shriek of a ship's engines atmo-burn]
  - id: saloon_interior
    items: [a card table with a marked deck in the discard, a synthesizer dispensing something brown into a chipped cup]
    conditions: [smoke from a hookah hanging in the air, a back door propped open]
    sensory: [the jangle of an out-of-tune piano, the hum of a cooler unit cycling]
  - id: desert_crossing
    items: [a rusted hull fragment half-buried in the dust, a cracked oxygen mask hanging from a post]
    conditions: [the heat shimmer distorting the horizon, the trail marker knocked askew]
    sensory: [the dry scrape of windblown sand, the creak of metal expanding in the heat]
  - id: mine_shaft
    items: [a drilling rig with the safety guard removed, a seismic charge with a dead trigger]
    conditions: [the ventilation fan cycling unevenly, the shaft dimly lit]
    sensory: [the echo of dripping water from deep below, the grinding of ore carts on damaged track]
  - id: orbit_station
    items: [an airlock with a jammed seal, a terminal showing docking fees overdue]
    conditions: [the gravity cycling on and off, the corridor dimly lit with emergency strips]
    sensory: [the low hum of the station's reactors, the click of magnetic boots on grated flooring]
  - id: repair_bay
    items: [a welding torch with a cracked lens, a diagnostic tablet showing red across the board]
    conditions: [the bay cold from the vacuum seal broken, tools scattered across every surface]
    sensory: [the hiss of a plasma cutter, the ozone smell of a recent electrical fire]
