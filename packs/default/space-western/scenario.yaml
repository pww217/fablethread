currency_id: credits
starting_currency_amount: 100
world_facts:
  - The Rim is not the frontier of dust, debt, and old loyalties — it is the loser's hospital. Twelve years after the war ended, people here are stubborn, resourceful, and suspicious of inner-worlders because they lost, they remember that they lost, and pretending they didn't is the work of every day.
  - The ship is everything — home, livelihood, and the only way out. Every pilot loves their vessel and has modifications keeping it flying; a broken ship is a death sentence, and the love is therefore also the fear.
  - Frontier danger is people — rival crews, hostile settlements, Coalition patrols running on inertia, harsh environment. The storm kills as fast as a plasma bolt, and no one in the inner systems can remember anymore why the patrols are still running.

constraints:
  # required-presence
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 7]
  prose_word_range: [530, 930]
  # composition
  required_inventory_kinds: [weapon, tool]

