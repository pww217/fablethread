examples:
  - title: "Salvage dive complete + barge fuel + diver death + council quest"
    thinking: |
      - Dived the flooded lobby; retrieved copper wire and a sealed container.
      - Spent 40 liters of diesel on the barge run to the highland market.
      - The diver didn't make it back from the lower floors; removed from present NPCs.
      - First objective of the trail-run quest completed by index.
    json: |-
      {"state_delta": {"scene_tags": ["salvage", "river"], "scene_tagline": "Salvage secured — the barge leaves the drowned lobby", "location_description": "The barge idles at the flooded lobby's upper entrance. Water laps at the rusted turnstiles. The highland market is visible on the ridge above, a cluster of terracotta roofs against the cliff face.", "present_npcs": [{"id": "captain-muir", "name": "Captain Elara Muir", "title": "River barge operator — Edgewater Run", "notes": "Pleased with the salvage haul. She is routing the barge to the highland market before the storm window closes.", "bio": "Run the Edgewater route between the drowned zones and the Highland Council. Knows every current, every submerged landmark, every storm pattern. She has been running this route for fifteen years."}], "inventory_add": [{"id": "copper-wire", "name": "Copper wire (salvaged)", "notes": "Stripped from the flooded building's lower floors; enough for two highland windmill builds.", "amount": 1}], "inventory_remove": [{"id": "diesel", "amount": 40}], "compendium_npc_remove": ["diver-hale"], "quest_updates": [{"id": "run-the-trail-supplies", "objectives": [{"index": 1, "done": true}]}]}, "actions": ["Ask Captain Muir about the storm forecast", "Visit the highland market stalls", "Check the barge hull for leaks", "Talk to the council liaison on the ridge"]}

  - title: "Food inventory change + raid risk + Edge settlement + quest creation"
    thinking: |
      - Spent dried fish and salt pork at the Edge settlement for water filter parts.
      - The settlement is under raid threat; the player's route may be blocked.
      - New quest: escort a supply barge through the flooded zone.
      - The diver has a map of the safe lanes through the submerged highways.
    json: |-
      {"state_delta": {"scene_tags": ["Edge", "tension"], "scene_tagline": "Parts acquired — the raiders are moving", "location_description": "The Edge settlement is a cluster of elevated platforms built on the last hill before the flood. Rain drums on the tarps. A supply barge is being loaded nearby.", "present_npcs": [{"id": "scout-nash", "name": "Scout Jax Nash", "title": "Highland trail scout", "notes": "Warning about raider movement on the lowland routes. He needs an escort for a supply run and he thinks the player is the only one who can make it.", "bio": "Maps the trail routes between highland communities. Knows where the raiders are operating and where the flood level is rising. He has been scouting for three seasons and lost two partners."}], "inventory_remove": [{"id": "dried-fish", "amount": 6}, {"id": "salt-pork", "amount": 3}], "inventory_add": [{"id": "filter-cartridge", "name": "Water filter cartridge", "notes": "Replacement cartridge for the barge's filtration system; lasts six months.", "amount": 1}], "quest_updates": [{"id": "escort-the-supply-barge", "title": "Escort the supply barge", "status": "active", "objectives": [{"description": "Escort the supply barge from the Edge settlement through the flooded zone to the Highland Council — the lowland routes are controlled by raiders.", "done": false}, {"description": "Use the submerged highway lanes from Scout Nash's map to avoid the raider patrols.", "done": false}]}]}, "actions": ["Accept the escort job with Scout Nash", "Survey the Edge settlement for additional supplies", "Descend to the flooded lobby to see the dive site", "Head to the barge and prep for the run"]}

  - title: "Minimal dialogue + condition + diver equipment + territorial dispute"
    thinking: |
      - Pure dialogue with the council liaison; no state changes this turn.
      - Took quinine for the fever from the last dive; condition managed.
      - The territorial dispute over the dive site needs resolution.
    json: |-
      {"state_delta": {"scene_tags": ["dialogue", "council"], "scene_tagline": "The dive site dispute", "location_description": "The council chamber is a repurposed observation deck on the ridge. Wind moves through the open sides. A hand-drawn map of the flood zones covers the central table.", "present_npcs": [{"id": "liaison-ross", "name": "Councilor Priya Ross", "title": "Highland Council — territorial liaison", "notes": "Presenting a case about the dive site: two communities claim the same flooded building. She needs the player's input.", "bio": "Elected representative for the Edge and Highland disputes. She has been mediating territorial conflicts for four seasons. She knows both communities and the flood maps by heart."}], "inventory_remove": [{"id": "quinine", "amount": 2}]}, "actions": ["Present the diver's perspective on the site", "Propose a shared salvage schedule", "Ask about the storm forecast for the coming season", "Visit the observation deck to survey the flood line"]}
