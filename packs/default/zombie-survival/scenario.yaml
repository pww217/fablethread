currency_id: credits
starting_currency_amount: 0
world_facts:
  - The infection is no longer a plague to be survived; it is a rearranged ecosystem the survivors must live inside, and the infected are partly the people they were.
  - Settlements persist as confederations of guilt — each member did something to still be here, and the settlement holds because admitting the alternative is the death of the group.
  - The mycelium is not spreading randomly; it is organizing. Roads form where there were none. The infected gather in patterns that resemble congregation more than hunt.

constraints:
   # required-presence
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  prose_word_range: [530, 930]
  # composition
  required_inventory_kinds: [weapon, consumable]

