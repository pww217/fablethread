npc_bonds:
  - id: settlement_founder
    tags: [community, founding, shared_labor]
    description: The NPC helped build the settlement the PC lives in. They dug the first well, stood the first wall, buried the first dead together.
  - id: scavenging_partner
    tags: [scavenging, survival, daily_risk]
    description: The NPC has run dozens of scavenging runs with the PC. They know each other's signals, limits, and what the other will carry out.
  - id: saved_from_infected
    tags: [rescue, life_debt, crisis]
    description: The NPC pulled the PC out of a horde encounter. The debt is not discussed but it is understood by both.
  - id: before_world_neighbor
    tags: [before, shared_history, loss]
    description: The NPC lived three doors down from the PC before the collapse. They remember each other's before-names and before-lives.
  - id: lost_child_found
    tags: [family, protection, found_family]
    description: The NPC is a child the PC found and has been protecting. The bond is parental, even if neither uses the word.
  - id: ration_debt
    tags: [survival, obligation, debt]
    description: The NPC kept the PC alive through a bad winter by sharing rations. The debt is material and neither has forgotten.
  - id: faction_double_agent
    tags: [faction, divided_loyalty, secrets]
    description: The NPC is part of a faction the PC distrusts, but there is a personal bond between them that crosses the faction line.
  - id: held_a_gate_together
    description: The NPC and PC once held a breach together while others fled. The memory is one of mutual reliance.
    tags: [shared_defense, trust, combat_bond]
    incompatible_with: []

pc_situation_schema:
  - key: home_settlement
    description: What settlement, if any, does the PC call home?
    required: false
    persist: true
  - key: transport
    description: What is the PC's mode of transport, if any? ("nothing" is valid)
    required: false
    persist: true
  - key: nearby_area
    description: What's beyond the PC's home settlement? Neighboring settlements, hordes, or other threats.
    required: false
  - key: family_status
    description: Who from the PC's family survived or didn't, and where are they?
    required: false

scene_detail_bundles:
  - id: abandoned_hospital
    items: [a gurney with torn restraints, a syringe half-filled with something dark]
    conditions: [the power flickering on backup battery, patient charts water-damaged into illegibility]
    sensory: [the hum of a surgical light on backup power, the smell of rot from a locked ward]
  - id: settlement_wall
    items: [a guard post with a periscope and a cracked optic, a cache of molotov cocktails wrapped in newspaper]
    conditions: [the wall patched in three places, gravel piled for quick fills]
    sensory: [the constant low moan from beyond the wall, the creak of the watchtower ladder under weight]
  - id: overgrown_street
    items: [a burned-out car with saplings growing through the chassis, a crate of bottled water]
    conditions: [a mattress dragged halfway across the intersection, the grocery store windows boarded but the door swinging]
    sensory: [the buzz of flies over something unseen, glass crunching underfoot with every step]
  - id: underground_bunker
    items: [a military radio tuned to static, a loaded pistol left on the table]
    conditions: [the water filtration pump with a cracked housing, the air stale and metallic]
    sensory: [the echo of footsteps down the corridor, the drip of condensation from a pipe overhead]
  - id: quarantine_zone
    items: [a decontamination tent with the flap torn, a loudspeaker on a pole repeating a recorded warning]
    conditions: [the fence layered with biohazard tape, the bedding pile abandoned]
    sensory: [the endless loop of a recorded warning echoing off concrete, the acrid smell of bleach concentrate]
  - id: radio_station
    items: [a broadcast microphone with the foam chewed off, a stack of records with hand-painted labels]
    conditions: [the window boarded but light coming through the cracks, the transmitter humming but untuned]
    sensory: [the crackle of static, the echo of footsteps on the tiled floor]
  - id: farm_outskirts
    items: [a tractor with the battery pulled, a root cellar door bolted from the outside]
    conditions: [the field overgrown with thistle, the fence line down in three places]
    sensory: [the low of cattle left untended, the rustle of dry corn stalks in the wind]
