pc_situation_schema:
  - key: residence
    description: Where does the PC live or operate from?
    required: false
  - key: contacts
    description: Who does the PC know in the city? Informants, allies, enemies?
    required: false
  - key: evidence
    description: What evidence, leverage, or compromising material does the PC have?
    required: false

npc_bonds:
  - id: former_partner
    tags: [partnership, shared_history, trust]
    description: The NPC was the PC's detective partner before the split — they know each other's tells, codes, and the case that ended the partnership.
  - id: childhood_friend
    tags: [youth, neighborhood, personal_history]
    description: The NPC grew up with the PC on the same streets. They both got out different ways, but the old connection still carries weight.
  - id: locked_up_together
    tags: [prison, shared_confinement, cell_block]
    description: The NPC and PC shared a cell block or holding cell. What passed between them there binds them still.
  - id: debt_to_informant
    tags: [underground, information, leverage]
    description: The NPC is a former informant who saved the PC's skin on a dockyard case. The PC owes a favor that keeps getting called.
  - id: old_war_buddy
    tags: [war, veteran, trench]
    description: The NPC served in the same unit as the PC overseas. The war is over but the habits — and the trust — stayed.
  - id: corrupted_witness
    tags: [testimony, corruption, court_case]
    description: The NPC was a witness in a case the PC worked. The testimony fell apart, the case collapsed, and the PC still doesn't know whose hand was in it.
  - id: family_connection
    tags: [family, obligation, blood_tie]
    description: The NPC is connected to the PC through family — a cousin, an in-law, a parent's old friend. The tie is personal, not professional.
  - id: case_from_before
    description: The NPC and PC crossed paths on a previous case — one helped, one hindered.
    tags: [previous_case, shared_history]
    incompatible_with: []

scene_detail_bundles:
  - id: back_alley
    items: [a fire escape ladder bolted to the brickwork, a payphone with the receiver dangling]
    conditions: [wet from last night's rain, the streetlamp out]
    sensory: [the hiss of a flickering neon sign, footsteps echoing from the next block]
  - id: police_precinct
    items: [a typewriter with a stuck 'e' key, a filing cabinet with the bottom drawer padlocked]
    conditions: [the floor slick from tracked-in rain, smoke hanging under the ceiling lights]
    sensory: [the clatter of a teletype machine, the smell of stale coffee and cheap tobacco]
  - id: speakeasy
    items: [a brass rail worn smooth by shoe leather, a glass with lipstick on the rim]
    conditions: [the room hazy with cigarette smoke, the music from the phonograph skipping]
    sensory: [the low laughter from a back room, the clink of glasses behind the bar]
  - id: hotel_room
    items: [a telephone with the cord cut, a hat left on the bedpost]
    conditions: [the radiator knocking, the window onto a fire escape that doesn't reach the ground]
    sensory: [the drip of a leaky faucet, voices from the room next door through thin walls]
  - id: dockyard
    items: [a crane with its load suspended halfway, a Customs manifest with a page torn out]
    conditions: [thick fog rolling off the water, the pier slick with oil]
    sensory: [the clang of metal on metal from a warehouse, the deep horn of a departing freighter]
  - id: rooftop_chase
    items: [a water tower with a loose ladder, a fire escape that ends six feet short]
    conditions: [the tar roof blistering in the sun, the gap between buildings wider than it looks]
    sensory: [the wail of a siren from the street below, the clatter of a loose antenna in the wind]
  - id: morgue_basement
    items: [a body drawer half-open with a tag attached, a dictaphone with a half-finished recording]
    conditions: [the fluorescent light buzzing, the floor drain stained]
    sensory: [the sharp smell of formaldehyde, the hum of the refrigeration unit]
