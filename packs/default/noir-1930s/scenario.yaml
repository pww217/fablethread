constraints:
   # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
   # ranges
  inventory_size_range: [4, 8]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [12, 18]
  prose_word_range: [275, 550]
   # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
   # creativity guards
  forbid_cliches:
     - "the dame was trouble"
     - "the case was a setup from the start"
     - "the city was a beast"
     - "he had a dark past"
     - "the bottle was his only friend"
     - "she smelled like gin and trouble"
     - "the office was on the third floor of a building that used to be something"
     - "the money was the least of it"
     - "the real killer was dead / missing / already in jail"
     - "the answer was the person standing right in front of him"
     - "a woman who played both sides"
     - "the corrupt politician was behind everything"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a detective or investigator — but not a hardened veteran with twenty
    years on the job. They are someone who learned the work through doing: a cop who
    got pushed onto the investigative desk, a former reporter who started their own
    agency, a union investigator who knows the streets, a federal agent who doesn't
    fit the bureau. Give them a specific skill (reading documents, reading rooms,
    reading people) and a specific liability (a reputation, a debt, a relationship
    that complicates things). They are not cynical by nature; they became that way
    by necessity.

  opening_situation: |
    Drop the player into a situation that is already unfolding — a body found in a
    back room above a saloon, a kidnapping in progress with the victim still alive,
    a gang hit that went wrong and left witnesses, a woman who bursts into your
    office bleeding and says "they're coming." The situation should involve immediate
    danger, a crime in motion, or a person in desperate need. The player should walk
    into something that demands action — pulling a gun, making a choice, running,
    or confronting someone who does not want to be confronted. The most interesting
    situations involve violence, betrayal, or a truth that someone is willing to
    kill to keep hidden.

  npcs: |
    Each NPC is a person embedded in the city's infrastructure: a cop who knows the
    evidence room, a reporter who knows the dock foreman, a union rep who knows the
    mayor's chief of staff, a judge who knows the DA's weakness, a bartender who
    knows who meets whom and when. They have a role in the system and a reason for
    being outside it in this moment. At least one NPC should have an interest that
    conflicts with the player's — not as a villain, but as someone with different
    information, different jurisdiction, or different priorities.

  inventory: |
    Items reflect what an investigator in the 1930s actually carried or had access to:
    a service weapon (or a concealed piece), a notebook, a flashlight, a lockpick set,
    a badge (real or fake), a camera, a revolver with limited ammunition, a .38
    snub-nose, a .45 government issue. Include one thing that was important to someone
    else — a letter, a photograph, a document. Show the gap between what the job
    requires and what the player actually has.

  arcs: |
    Arc seeds should center on crime, corruption, and moral compromise.
    Visible goals: find a missing person before they are killed, expose a gangster
    without becoming a target, protect a witness who everyone wants silenced, get
    proof of a murder before the killer covers their tracks, survive a night in
    the wrong part of town. Thematic questions: how corrupt does the system have
    to be before you fight back? What line won't you cross — and what line will
    you cross anyway? Can you do the right thing and survive it? PC drives: get
    revenge, clear your name, protect someone you care about, get rich fast,
    expose the truth, survive the night. Hidden truths: the client set you up,
    the victim is alive and lying to you, the cop you trust is on the take, the
    murder was a message, not the final act. Thread ideas: a body with a
    connection to your past, a woman who plays both sides, a gang war that
    escalates beyond control, a witness who changes their story, a betrayal
    from someone you trusted.
