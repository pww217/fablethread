currency_id: dollars
starting_currency_amount: 50
world_facts:
  - The city runs on violence and money — gangsters control the docks, the unions, and the night; the police take a cut; ask too many questions and you get a bullet or a frame-up. The system works because the system works.
  - Every man has an angle, and the angle is often still the man you knew — the betrayal is the recognition, not the knife.
  - The city at night is not a character; it is a witness — it arranges itself so the thing you didn't want to see is unavoidable.

constraints:
  # required-presence
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  prose_word_range: [530, 930]
  # composition
  required_inventory_kinds: ['weapon', 'tool']

world_rules:
  - No supernatural, paranormal, or sci-fi phenomena exist in this setting. All technology and social conditions are grounded in the 1930s United States.

