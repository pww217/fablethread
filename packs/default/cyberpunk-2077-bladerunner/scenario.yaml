constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [3, 6]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [10, 12]
  prose_word_range: [275, 550]
  # composition
  required_inventory_kinds: [weapon, tool]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "retired mercenary pulled back in for one last job"
    - "orphan of the streets with a hidden talent"
    - "corporate defector who knows too much"
    - "the only person immune to the AI"
    - "cyberpsychosis taking hold"
    - "the body is the real weapon"
    - "a message from a dead contact"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a specific person operating in the gap between the corps and the street.
    They could be a fixer working their network, a netrunner burning through ICE, a
    street doc keeping people alive off the grid, a corpo low-level functionary with
    access they don't fully understand, a courier carrying data that matters, a security
    contractor who knows which side pays better. What shaped them is the city's pressure
    — the corp structure that employed then discarded them, the street that taught them to
    survive, the augmentation that changed how they experience the world. Avoid the
    archetypes; give them a specific job, a specific regret, and something they need
    that the city won't sell.

  opening_situation: |
    Drop the player into a moment that's already in motion — something that happened to
    them, not something they chose. The situation should feel like inheriting a problem,
    not starting a quest. What went wrong? What needs answering? The most interesting
    moments are quiet: a data-drop that arrived from a dead source, a contact who showed
    up with damage they can't explain, a corporate message that shouldn't have reached
    them, a street-level crisis that requires a decision the player is the only one who
    can make. The opening should feel like a Tuesday in a city that never sleeps because
    sleeping is a luxury.

  npcs: |
    Each NPC is a person with a history in this city, a specific relationship to the
    player, and something they're not saying. At least one should have interests that
    conflict with the player's — not as a villain, but as someone whose survival
    depends on different choices. The augmented speak differently than the unmodified.
    The corps have their mannerisms; the street has theirs. Everyone wants something;
    everyone is concealing something.

  inventory: |
    Items reflect the PC's role in the city. A netrunner carries deck accessories and
    counter-ICE. A street samurai carries weapons and something sentimental they'll
    never admit to. A corpo functionary carries access tools and a reason they need
    them. Show what the character uses daily — the specific tools, the specific numbers.
    Avoid the grab-bag inventory; every item should say something about who this person is.

  quests: |
    The starting quest should have stakes that matter on the street — something personal,
    territorial, or survival-based. The objectives should force the player into contact
    with the city's power structure, not around it. There should be at least one objective
    that puts the player in tension with another NPC or faction. The quest should feel
    like it has a cost — not just in credits, but in trust, in safety, in what the
    player is willing to do.
