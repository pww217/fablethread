constraints:
  # required-presence
  min_named_npcs: 2
  min_objectives_per_quest: 2
  starting_quest_count: 1
  # ranges
  inventory_size_range: [4, 8]
  pc_stat_range: [1, 4]
  pc_stat_total_range: [12, 18]
  prose_word_range: [275, 550]
  # composition
  required_inventory_kinds: [weapon, consumable]
  npc_distinct_first_letters: true
  # creativity guards
  forbid_cliches:
    - "immune to infection"
    - "the cure is the MacGuffin"
    - "amnesia"
    - "chosen one"
    - "lone wolf who trusts no one"
    - "the infected are about to learn to speak again"
    - "a scientist who knows everything about the fungus"
    - "the military is secretly good"
    - "the child is actually the monster"
  forbid_player_dependents: true
  forbid_legendary_items: true

inspiration:
  pc: |
    The PC is a specific person twenty years in. They were born into the before-world
    or born after the collapse — make that choice and let it shape everything else.
    Before-world survivors carry specific losses and specific before-skills (carpenter,
    nurse, teacher, electrician, long-haul trucker) that have adapted into survival
    tools. After-world people have never known anything different — they can read
    infection signs the way their parents read traffic lights. Give the PC a concrete
    role in whatever community or arrangement they belong to, and give them something
    they are actively trying to protect or reach. Avoid defining them by tragedy alone
    — they are also good at something, care about something, find something funny
    under impossible circumstances.

  opening_situation: |
    Drop the player into a moment with immediate weight in a world that has had
    twenty years to change. Not a fresh crisis — a complicated one. A settlement
    facing a decision it cannot avoid. A route through nature-reclaimed city blocks
    where something has changed since the last run. A delivery that reveals
    something about a person the PC thought they knew. An infected that behaved
    in a way that contradicts everything that was thought to be known. The setting
    should feel like the world it is — overgrown, lived-in, layered with twenty
    years of adaptation. A place with its own culture and history and a specific
    problem that cannot wait.

  npcs: |
    Each NPC is a whole person. Before-world or after-world — make that call and
    let it shape their frame of reference. The settlement leader who made a deal
    with FEDRA and lives with what that cost. The patrol runner who has never been
    inside a FEDRA zone and doesn't trust the description. The kid who grew up in
    the settlement and thinks the before-world stories are exaggerated. At least
    one NPC should want something that directly conflicts with what the player
    needs — not as an obstacle, but as a person whose community depends on a
    different answer. People lie, conceal, protect, miscalculate. Give them all
    of that.

  inventory: |
    Twenty years of improvisation and selective preservation. A before-world
    survivor carries things with personal weight — a specific tool from their
    former life, a weapon that has been repaired so many times the original parts
    are a minority, a photograph inside the lining of a jacket. An after-world
    survivor carries things they were taught to carry — a gas mask with cracked
    straps carefully mended, a hand-drawn map in someone else's handwriting,
    a trade good they were told never to use unless they had no other choice.
    Show what the character uses and what they won't put down. Show the numbers —
    not "some ammo" but 9 shells. Not "medicine" but three doses of a specific
    antibiotic they can't resupply.

  quests: |
    The starting quest should be personal and situated — not saving the world, but
    keeping a specific piece of it together. A person to reach before the route
    closes for winter. A cache to recover before a rival settlement gets there.
    A truth to learn about something that happened in the settlement before things
    come apart. A debt to pay before it gets called in. The objectives should cost
    something real — time, trust, resources, a relationship — and at least one
    should put the player in direct tension with an NPC whose motives are
    legitimate. No clean wins.
