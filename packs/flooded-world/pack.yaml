id: flooded-world
name: "The Drowned Earth"
description: "Post-flood survival on a world two hundred feet under. Every run is different."
genre: post-apocalyptic
tone_tags: [grim, survival, spatial, political]
version: 2
mode: dynamic
baseline_facts:
  - "The **Treaty of Andes (2138)** divides the Highlands between the surviving nation-states, but enforcement ends fifty kilometers from any administrative center; the Edge — the contested transition zone where flood meets land — is governed by whoever has working radios, fuel, and friends, and treaty patrols are 'somewhere on the other side of the ridge' on principle."
  - "Salt is the Highlands' most valuable trade good — desalination is energy-prohibitive, and clean salt extracted from the floods is sold by the kilo back to coastal divers; **a kilo of clean salt buys a week of bunk space** in any plateau city, and salt-runners are the wealthiest unsanctioned class on the continent."
  - "Diving the Flooded Zones is regulated by guilds that hold the only accurate maps as inheritance; the **Cartographers' Compact (2129)** makes unsanctioned mapping a capital offense in three of the surviving guilds, and a person who knows where a sunken pharmacy or armoury sits can name their price — once."
