[project]
name = "ccya"
version = "0.1.0"
description = "A choose-your-own-adventure game backed by a local LLM (mlx-lm)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pyyaml",
    "httpx",
    "pydantic",
    "sse-starlette",
    "python-multipart",
    "openai",
    "faker",
]

[project.scripts]
ccya = "ccya.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["ccya"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
]
