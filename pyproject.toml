[project]
name = "ccya"
version = "0.1.0"
description = "A choose-your-own-adventure game backed by a local LLM (mlx-lm)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pyyaml",
    "httpx",
    "pydantic",
    "sse-starlette",
    "python-multipart",
    "openai",
    "faker",
    "pykakasi",
]

[project.scripts]
ccya = "ccya.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["ccya"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["ccya.server", "ccya.server.*"]
disable_error_code = ["untyped-decorator", "no-untyped-def", "no-untyped-call", "attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["ccya.rules"]
disable_error_code = ["name-defined"]


[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]
