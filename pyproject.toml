[project]
name = "ccya"
version = "0.1.0"
description = "A choose-your-own-adventure game backed by a local LLM (mlx-lm)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pyyaml",
    "httpx",
    "pydantic",
    "sse-starlette",
    "python-multipart",
    "openai",
    "faker",
]

[project.scripts]
ccya = "ccya.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# F821: undefined-name (false positive for string forward refs like "RulesOutcome")
# E402: module-level-import-not-at-top-of-file (pre-existing in test_engine_smoke.py)
# F841: local-variable-assigned-but-never-used (pre-existing dead code in test_pack_loader.py)
ignore = ["F821", "E402", "F841"]
