[project]
name = "fablethread"
version = "0.1.0"
description = "A local CYOA engine with persistent world state that remembers. Structured state, PbtA dice, validation, streaming narration. Model-neutral — runs anywhere with an OpenAI-compatible API."
requires-python = "==3.15.0"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "pydantic==2.13.3",
    "sse-starlette==3.3.4",
    "python-multipart==0.0.31",
    "openai==2.33.0",
    "faker==40.15.0",
    "pykakasi==2.3.0",
]

[project.scripts]
fablethread = "fablethread.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["fablethread"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["fablethread.server", "fablethread.server.*"]
disable_error_code = ["untyped-decorator", "no-untyped-def", "no-untyped-call", "attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["fablethread.rules"]
disable_error_code = ["name-defined"]


[dependency-groups]
dev = [
    "mypy==1.20.2",
    "ruff==0.15.12",
    "types-pyyaml==6.0.12.20260906",
]
