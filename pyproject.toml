[project]
name = "ccya"
version = "0.1.0"
description = "A choose-your-own-adventure game backed by a local LLM (mlx-lm)."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pyyaml",
    "httpx",
    "pydantic",
    "sse-starlette",
    "python-multipart",
    "openai",
]

[project.scripts]
ccya = "ccya.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
