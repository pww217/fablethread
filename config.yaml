llm:
  host: http://127.0.0.1:8000/v1
  model: mlx-community--gemma-4-26B-A4B-it-OptiQ-4bit
  num_ctx: 16384
  context_window: 16384
  request_timeout_s: 120
  fallback_cooldown_s: 1800

  ruling:
    temperature: 0.2
    top_p: 0.80

  extract:
    temperature: 0.4
    top_p: 0.85
    frequency_penalty: 0.05

  narrate:
    temperature: 0.9
    top_p: 0.95
    frequency_penalty: 0.3

  prepare_seed:
    temperature: 0.4
    top_p: 0.95

  pack_generation:
    temperature: 0.8
    top_p: 0.95

  max_llm_retries: 1

server:
  bind_host: 127.0.0.1
  bind_port: 8765
  
  logging:
    level: INFO
    console_level: INFO

game:
  thread_deescalate_on_success: true

  warmup_on_start: false
  character_creation_enabled: true

  # Max entries in recent_beats history passed to world step
  recent_beats_max: 5

  debug:
    enabled: true
