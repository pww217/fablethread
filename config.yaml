llm:
  host: http://127.0.0.1:8080/v1
  model: mlx-community/gemma-4-26b-a4b-it-mxfp8
  request_timeout_s: 180
  narrate_temperature: 0.9
  extract_temperature: 0.4
  max_extract_retries: 1
  enable_extract_thinking: false   # true = append /think to extract prompt (Qwen3 only); strips <think> tags
  enable_narrate_thinking: false   # true = append /think to narrate prompt (Qwen3 only); strips <think> tags

# mlx_lm.server settings — host/port/model are derived from llm.* above.
# Run `make mlx-serve` to start/check the server; `make run` calls it automatically.
mlx:
  env: /Users/pwilson/mlx-env   # virtualenv where mlx_lm is installed (mlxenv alias)
  max_tokens: 32768              # --max-tokens: per-request generation cap
  prompt_cache_size: 4           # --prompt-cache-size: distinct KV caches to hold in RAM
  prompt_cache_bytes: 21474836480  # --prompt-cache-bytes: total KV cache budget (20 GiB)
  log_level: DEBUG               # --log-level: DEBUG for full prompt/response traces
  # Tokenizer kwargs forwarded to apply_chat_template (model-agnostic).
  # `enable_thinking: false` is the model-neutral kill switch — Qwen3 honors it,
  # tokenizers without the kwarg silently ignore it. The per-call llm.enable_*_thinking
  # flags above act as opt-in overrides (inject /think in the user message).
  # Set to "" to disable the flag entirely.
  chat_template_args: '{"enable_thinking": false}'

game:
  default_save: default
  setting_pack: zombie-survival
  window_turns: 4 # Down from 6 to save on tokens.
  chronicle_prefix_budget_tokens: 1500
  established_facts_max: 30    # rolling window; seed lore is baked in as initial state
  warmup_on_start: true

server:
  bind_host: 127.0.0.1
  bind_port: 8765

logging:
  file: logs/llm-g.log
  level: INFO            # DEBUG required for log_llm_io payloads to be emitted
  log_llm_io: false        # log full prompts + raw responses to logs/llm-g.log
  log_llm_io_max_chars: 4000   # truncate per field to keep log readable

debug:
  panel: true
