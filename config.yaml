llm:
  host: http://127.0.0.1:8080/v1
  model: mlx-community/gemma-4-26b-a4b-it-mxfp8
  request_timeout_s: 180

  ruling:
    temperature: 0.2
    top_p: 0.80

  extract:
    temperature: 0.4
    top_p: 0.85
    frequency_penalty: 0.15

  narrate:
    temperature: 0.9
    top_p: 0.95
    frequency_penalty: 0.5

  generate_seed:
    temperature: 0.9
    top_p: 0.95

  pack_generation:
    temperature: 0.8
    top_p: 0.95

  max_llm_retries: 1

  context_window: 32768

server:
  bind_host: 127.0.0.1
  bind_port: 8765
  
  logging:
    level: DEBUG
    log_llm_io: false
    log_llm_io_max_chars: 4000
    log_prompts: true

game:
  momentum_floor: -3
  consecutive_pressure_threshold: 3
  thread_deescalate_on_success: true

  warmup_on_start: false
  character_creation_enabled: true

  debug:
    enabled: true
