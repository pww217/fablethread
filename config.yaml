llm:
  host: http://127.0.0.1:8080/v1
  model: mlx-community/gemma-4-26b-a4b-it-mxfp8
  request_timeout_s: 180
  narrate_temperature: 0.9
  extract_temperature: 0.4
  max_extract_retries: 1
  enable_extract_thinking: false
  enable_narrate_thinking: false

rules:
  temperature: 0.2
  max_retries: 1

game:
  default_save: default
  setting_pack: zombie-survival
  window_turns: 6
  chronicle_prefix_budget_tokens: 1500
  established_facts_max: 30    # rolling window; seed lore is baked in as initial state
  warmup_on_start: true

server:
  bind_host: 127.0.0.1
  bind_port: 8765

logging:
  file: logs/llm-g.log
  level: INFO            # DEBUG required for log_llm_io payloads to be emitted
  log_llm_io: false        # log full prompts + raw responses to logs/llm-g.log
  log_llm_io_max_chars: 4000   # truncate per field to keep log readable

debug:
  panel: true
